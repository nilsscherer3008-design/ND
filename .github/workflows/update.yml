name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachrichten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-push installieren (für Handy-Mitteilungen)
        run: npm install web-push --no-save --silent

      - name: Nachrichten sammeln und zusammenfassen
        run: node update.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUSH_URL: ${{ vars.PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          VAPID_PUBLIC: ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Neue Ausgabe speichern
        run: |
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Nachrichten-Update $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git push
          fi
          
