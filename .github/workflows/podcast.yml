name: Podcast-Folge

# Baut einmal am Tag eine Gesprächsfolge aus dem meistbelegten Thema.
# Läuft unabhängig von den Nachrichten – geht hier etwas schief,
# bleibt die App davon unberührt.

on:
  schedule:
    - cron: "40 16 * * *"      # 18:40 Berliner Zeit im Sommer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-folge
  cancel-in-progress: false

jobs:
  folge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stimme zwischenspeichern
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .stimmen
          key: piper-stimme-de-mls-medium-v1

      - name: Bisherige Folgen holen
        continue-on-error: true
        run: |
          mkdir -p ton
          if git fetch --depth=1 origin ton; then
            git archive FETCH_HEAD | tar -x -C ton
            echo "Vorhandene Aufnahmen: $(ls ton | wc -l)"
          fi

      - name: Gespräch schreiben und sprechen
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet piper-tts
          python3 podcast.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASIS: ${{ vars.OPENAI_BASIS }}
          OPENAI_MODELL: ${{ vars.OPENAI_MODELL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
