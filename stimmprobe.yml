name: Stimmen anhören

# Läuft nur von Hand. Erzeugt Hörproben verschiedener Sprecher, damit man
# die Besetzung für den Podcast aussuchen kann.

on:
  workflow_dispatch:
    inputs:
      sprecher:
        description: "Sprechernummern, durch Komma getrennt (leer = 24 gut verteilte)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  proben:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stimme zwischenspeichern
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .stimmen
          key: piper-stimme-de-mls-medium-v1

      - name: Proben sprechen
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet piper-tts
          python3 stimmprobe.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROBE_SPRECHER: ${{ github.event.inputs.sprecher }}

      - name: Proben in den Ton-Zweig legen
        run: |
          if [ -z "$(ls -A ton/proben 2>/dev/null)" ]; then
            echo "Keine Proben erzeugt."
            exit 1
          fi
          rm -rf /tmp/tonzweig && mkdir -p /tmp/tonzweig
          if git fetch --depth=1 origin ton; then
            git archive FETCH_HEAD | tar -x -C /tmp/tonzweig
          fi
          mkdir -p /tmp/tonzweig/proben
          cp ton/proben/*.mp3 /tmp/tonzweig/proben/
          cd /tmp/tonzweig
          git init -q -b ton
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Stimmproben $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ton:ton
          echo "Veröffentlicht: $(ls proben | wc -l) Proben"

      - name: Anhörseite speichern
        run: |
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proben
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git commit -m "Stimmproben zum Anhören $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4 5; do
            if git push; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1

      - name: Wo man es findet
        run: |
          echo "Öffne: https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/proben/"
