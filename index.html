  const x0 = ort.lon - breite * mx0, y1 = ort.lat + hoehe * my0;
  const px = ([lon, lat]) => [((lon - x0) / breite * W).toFixed(1), ((y1 - lat) / hoehe * H).toFixed(1)];
  let pfade = "";
  for (const land of weltLaden()) for (const ring of land){
    let drin = false;
    for (const [lon, lat] of ring) if (lon > x0 - 8 && lon < x0 + breite + 8 && lat < y1 + 8 && lat > y1 - hoehe - 8){ drin = true; break; }
    if (!drin) continue;
    pfade += `<path d="M${ring.map(px).map(p => p.join(",")).join("L")}Z"/>`;
  }
  const [mx, my] = px([ort.lon, ort.lat]);
  return `<svg class="karte" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Karte: ${esc(ort.name)}">
    <rect width="${W}" height="${H}" class="k-meer"/><g class="k-land">${pfade}</g>
    <g class="k-punkt" transform="translate(${mx} ${my})"><circle r="26" class="k-welle"/><circle r="9"/><circle r="3.5" class="k-kern"/></g>
    ${ohneName ? "" : `<text x="${mx}" y="${+my - 22}" class="k-name" text-anchor="middle">${esc(ort.name)}</text>`}</svg>`;
}

/* ================= Erkennungsmelodie (selbst erzeugt, keine fremde Musik) ================= */
let TON = null;
function tonKontext(){
  try { TON = TON || new (window.AudioContext || window.webkitAudioContext)(); if (TON.state === "suspended") TON.resume(); return TON; } catch { return null; }
}
function note(ctx, frequenz, start, dauer, lautstaerke = .22, form = "sine"){
  const o = ctx.createOscillator(), g = ctx.createGain(), o2 = ctx.createOscillator();
  o.type = form; o2.type = "triangle";
  o.frequency.value = frequenz; o2.frequency.value = frequenz * 2.005;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
  const g2 = ctx.createGain(); g2.gain.value = 0.25;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  o.start(start); o2.start(start); o.stop(start + dauer + .05); o2.stop(start + dauer + .05);
}
// Nachrichten-Opener: tiefer Bass, dezentes Ticken, keine Melodie (ca. 3 Sekunden)
function tick(ctx, start, lautstaerke = .05){
  const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  o.type = "square"; o.frequency.value = 2400;
  f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = 6;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, start + 0.05);
  o.connect(f); f.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start + 0.07);
}
// kurzer, tiefer Schlag (wie eine gedämpfte Pauke)
function puls(ctx, start, lautstaerke){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(110, start);
  o.frequency.exponentialRampToValueAtTime(45, start + 0.14);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, start + 0.34);
  o.connect(g); g.connect(ctx.destination); o.start(start); o.stop(start + 0.4);
}
// kurzer Akkordschlag mit blechartigem Klang
function blech(ctx, frequenzen, start, dauer, lautstaerke){
  const g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = "lowpass"; f.Q.value = 2.5;
  f.frequency.setValueAtTime(600, start);
  f.frequency.exponentialRampToValueAtTime(4200, start + 0.08);   // weicher Anblas-Moment
  f.frequency.exponentialRampToValueAtTime(1400, start + dauer);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.035);
  g.gain.setValueAtTime(lautstaerke, start + Math.min(0.18, dauer * 0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
  // Grundton, Oktave und Quinte darüber: klingt voller und lauter
  const alle = frequenzen.flatMap(fr => [fr, fr * 2, fr * 3]);
  for (const fr of alle){
    if (fr > 6000) continue;
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr;
    const d = ctx.createOscillator(); d.type = "sawtooth"; d.frequency.value = fr * 1.007;
    const mix = ctx.createGain(); mix.gain.value = fr > 900 ? 0.45 : 1;
    o.connect(mix); d.connect(mix); mix.connect(f);
    o.start(start); d.start(start); o.stop(start + dauer + .05); d.stop(start + dauer + .05);
  }
  f.connect(g); g.connect(ctx.destination);
  rauschen(ctx, start, Math.min(0.22, dauer), 5000, 1200, lautstaerke * 0.35);  // Luft im Anblasen
}

function rauschen(ctx, start, dauer, vonHz, bisHz, lautstaerke){
  const laenge = Math.ceil(ctx.sampleRate * dauer), puffer = ctx.createBuffer(1, laenge, ctx.sampleRate), daten = puffer.getChannelData(0);
  for (let i = 0; i < laenge; i++) daten[i] = (Math.random() * 2 - 1) * (1 - i / laenge);
  const q = ctx.createBufferSource(); q.buffer = puffer;
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.1;
  f.frequency.setValueAtTime(vonHz, start); f.frequency.exponentialRampToValueAtTime(bisHz, start + dauer);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + dauer * 0.75);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
  q.connect(f); f.connect(g); g.connect(ctx.destination); q.start(start); q.stop(start + dauer + .05);
}
function bassRutsch(ctx, start, vonHz, bisHz, dauer, lautstaerke){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(vonHz, start);
  o.frequency.exponentialRampToValueAtTime(bisHz, start + dauer);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer);
  o.connect(g); g.connect(ctx.destination); o.start(start); o.stop(start + dauer + .05);
}
// Streicherteppich (weicher, alter Orchesterklang)
function streicher(ctx, frequenzen, start, dauer, lautstaerke){
  const g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 1600; f.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(lautstaerke, start + 0.7);
  g.gain.setValueAtTime(lautstaerke, start + dauer - 0.6);
  g.gain.linearRampToValueAtTime(0.0001, start + dauer);
  for (const fr of frequenzen) for (const v of [1, 1.004, 0.997]){
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr * v;
    const m = ctx.createGain(); m.gain.value = 0.33 / frequenzen.length;
    o.connect(m); m.connect(f); o.start(start); o.stop(start + dauer + .1);
  }
  f.connect(g); g.connect(ctx.destination);
}
// Pauke
function pauke(ctx, start, lautstaerke){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(115, start);
  o.frequency.exponentialRampToValueAtTime(44, start + 0.16);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke, start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
  o.connect(g); g.connect(ctx.destination); o.start(start); o.stop(start + 0.65);
  rauschen(ctx, start, 0.12, 900, 200, lautstaerke * 0.25);   // Fellanschlag
}
// Erkennungsmelodie: klassisch-orchestral, Puls, zwei Akkordwechsel, großer Schluss (ca. 9 s)
// Aufziehendes Rauschen – das, was vor jedem Filmtitel die Spannung aufbaut
function riser(ctx, start, dauer, lautstaerke = .10){
  rauschen(ctx, start, dauer, 200, 7000, lautstaerke);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(70, start);
  o.frequency.exponentialRampToValueAtTime(700, start + dauer);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(lautstaerke * 0.8, start + dauer * 0.88);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dauer + 0.12);
  o.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start + dauer + 0.2);
}
// Beckenschlag auf den Schlussakkord
function becken(ctx, start, lautstaerke = .22){
  const laenge = Math.floor(ctx.sampleRate * 1.8);
  const puffer = ctx.createBuffer(1, laenge, ctx.sampleRate);
  const d = puffer.getChannelData(0);
  for (let i = 0; i < laenge; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / laenge, 2.2);
  const q = ctx.createBufferSource(); q.buffer = puffer;
  const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 4500;
  const g = ctx.createGain();
  g.gain.setValueAtTime(lautstaerke, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + 1.8);
  q.connect(f); f.connect(g); g.connect(ctx.destination);
  q.start(start);
}
// Glocke – heller Anschlag mit langem Ausklang
function glocke(ctx, frequenz, start, lautstaerke = .14){
  [1, 2.01, 3.03, 4.2].forEach((teil, i) => note(ctx, frequenz * teil, start, 3.2 - i * 0.5, lautstaerke / (i + 1.6), "sine"));
}
function melodie(){
  const ctx = tonKontext(); if (!ctx) return 0;
  const t = ctx.currentTime + 0.05;
  streicher(ctx, [110, 164.81, 220], t, 4.8, .16);          // Streicher tragen von Anfang an
  note(ctx, 55, t, 3.2, .16);
  for (let i = 0; i < 6; i++) pauke(ctx, t + 0.15 + i * 0.42, .22 + i * 0.035);
  const takt = 0.42, s = t + 2.7;
  for (let i = 0; i < 6; i++){
    const z = s + i * takt;
    pauke(ctx, z, i % 2 === 0 ? .50 : .30);
    note(ctx, 73.42, z, takt * 0.9, .10);
    if (i % 2 === 0) blech(ctx, [110, 164.81], z, 0.34, .34);
  }
  blech(ctx, [123.47, 185, 246.94], s + 6 * takt, 0.50, .40);   // erster Akkordwechsel
  pauke(ctx, s + 6 * takt, .55);
  blech(ctx, [130.81, 196, 261.63], s + 7 * takt, 0.50, .42);   // zweiter Akkordwechsel
  pauke(ctx, s + 7 * takt, .55);
  const ende = s + 8 * takt;
  pauke(ctx, ende, .85);
  blech(ctx, [146.83, 220, 293.66, 369.99], ende, 2.6, .52);    // großer Schlussakkord
  streicher(ctx, [146.83, 220, 293.66], ende, 2.8, .18);
  note(ctx, 36.71, ende, 2.6, .28);
  return 7.3;   // danach setzt die Stimme ein, der Akkord klingt darunter aus
}

// Abspann: drei Akkorde, die zur Ruhe kommen
function schlussKlang(){
  const ctx = tonKontext(); if (!ctx) return 0;
  const t = ctx.currentTime + 0.05;
  blech(ctx, [146.83, 220, 293.66], t, 0.7, .26);
  pauke(ctx, t, .34);
  blech(ctx, [130.81, 196, 261.63], t + 0.62, 0.7, .24);
  blech(ctx, [110, 164.81, 220, 329.63], t + 1.24, 2.4, .30);
  streicher(ctx, [110, 164.81, 220], t + 1.24, 2.8, .16);
  note(ctx, 55, t + 1.24, 2.6, .22);
  becken(ctx, t + 1.24, .14);
  return 0;
}
// Wissens-Intro: staunen statt Eilmeldung – weiter Klangraum, aufsteigende Figur, helle Glocke
function zupf(ctx, frequenz, start, lautstaerke = .13){
  // kurzer, holzig-weicher Anschlag wie ein Marimbaton
  note(ctx, frequenz, start, 0.9, lautstaerke, "sine");
  note(ctx, frequenz * 4, start, 0.22, lautstaerke * 0.25, "sine");
  note(ctx, frequenz * 9.2, start, 0.10, lautstaerke * 0.10, "sine");
}
function wissenMelodie(){
  const ctx = tonKontext(); if (!ctx) return 0;
  const t = ctx.currentTime + 0.05;
  // weicher Klangteppich, kein Orchester – das ist keine Nachrichtensendung
  streicher(ctx, [130.81, 196, 261.63, 392], t, 6.4, .12);
  note(ctx, 65.41, t, 5.4, .13);
  rauschen(ctx, t, 1.6, 300, 2600, .045);                       // leiser Luftzug am Anfang
  // neugierige Frage: eine Figur, die nach oben steigt und offen stehen bleibt
  const figur = [261.63, 329.63, 392, 493.88, 587.33, 659.25];
  figur.forEach((f, i) => zupf(ctx, f, t + 0.55 + i * 0.26, .14 - i * 0.008));
  zupf(ctx, 783.99, t + 2.25, .15);
  glocke(ctx, 1046.5, t + 2.55, .13);                           // heller Anschlag: der Aha-Moment
  const ende = t + 3.15;
  streicher(ctx, [130.81, 196, 261.63, 329.63], ende, 3.2, .15);
  zupf(ctx, 523.25, ende, .13);
  glocke(ctx, 659.25, ende + 0.12, .10);
  note(ctx, 65.41, ende, 2.8, .16);
  return 4.4;
}

// kurzes Übergangsgeräusch zwischen zwei Themen
function uebergang(){
  const ctx = tonKontext(); if (!ctx || PLAYER.stumm) return;
  const t = ctx.currentTime + 0.01;
  rauschen(ctx, t, 0.28, 700, 5200, .09);
  note(ctx, 73.42, t + 0.05, 0.5, .10);
}

// Leise Ticker-Spur unter der Stimme (läuft im Hintergrund weiter)
let TICKER = null;
function tickerStart(){
  const ctx = tonKontext(); if (!ctx || TICKER) return;
  const takt = () => { if (!TICKER) return; tick(ctx, ctx.currentTime + 0.02, .012); };
  TICKER = setInterval(takt, 500); takt();
}
function tickerStopp(){ clearInterval(TICKER); TICKER = null; }
// kurzes Signal vor einer Eilmeldung
function eilSignal(){
  const ctx = tonKontext(); if (!ctx) return 0;
  const t = ctx.currentTime + 0.05;
  note(ctx, 880, t, 0.18, .16, "square");
  note(ctx, 660, t + 0.22, 0.30, .14, "square");
  return 0.6;
}

const ZAHLWORT = ["null","eine","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn"];

// Wer liest? "Einfach erklärt" hat eine eigene Stimme, wie eine eigene Sendung.

function segmenteBauen(format, id){

    const t = e.changedTouches[0], dy = t.clientY - y0, dx = t.clientX - x0;
    if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)){
      gewischt = true;
      wischAnimation(buehne, dy < 0);
      steuern(dy < 0 ? "weiter" : "zurueck");

    y0 = null;
    if (!gewischt && Math.abs(dy) < 12 && Math.abs(dx) < 12) steuern("play");   // tippen = Pause
  }, { passive:true });

function tafelnBauen(s){

  for (let i = 0; i < fakten.length && t.length < 3; i += 2) t.push({ typ:"zahl", werte: fakten.slice(i, i + 2) });
  (d.positionen || []).filter(z => z && z[0] && z[1]).slice(0, 2).forEach(z => t.push({ typ:"zitat", wer:z[0], was:z[1], quelle:z[2] }));
  if ((d.zeitleiste || []).length >= 2) t.push({ typ:"zeit", eintraege: d.zeitleiste.slice(-4) });
  if ((d.einig || []).length >= 1) t.push({ typ:"einig", punkte: d.einig.slice(0, 3), anzahl:(d.medien || []).length });
  if ((d.medien || []).length >= 2) t.push({ typ:"medien", medien: d.medien.slice(0, 6) });

}

  if (s.typ === "vergleich") return (s.saetze || []).map(() => ({ typ:"vergleich",
    einigText:s.einigText, offenText:s.offenText, medienZahl:s.medienZahl, medienNamen:s.medienNamen }));
  if (s.typ === "begriff") return (s.saetze || []).map((x, i) => ({ typ:"begriff", titel:s.titel, text:x, erster:i === 0 }));
  if (s.typ === "wetter") return (s.saetze || []).map((_, i) => ({ typ:"wetter", w:s.wetter, tag: i === 0 ? "heute" : "morgen" }));
  const tafeln = tafelnBauen(s);
  const shots = [];
  // Lange Kapitel wie in einer Doku: überwiegend Bild mit ruhiger Kamerafahrt,
  // dazwischen immer wieder eine Grafik. Kurze Meldungen wechseln schneller.
  const rhythmus = n > 20 ? 4 : 2;
  let bi = 0, ti = 0;
  for (let i = 0; i < n; i++){
    if (s.kapitelKarte && i === 0){ shots.push({ typ:"titel", titel:s.titel, rubrik:s.rubrik }); continue; }
    const tafelDran = tafeln.length && (i % rhythmus === rhythmus - 1 || !bilder.length);
    if (tafelDran) shots.push(tafeln[ti++ % tafeln.length]);
    else if (bilder.length) shots.push(bilder[bi++ % bilder.length]);
    else shots.push({ typ:"titel", titel:s.titel, rubrik:s.rubrik, eil:s.eil });
  }
  return shots;
}

function untertitel(){

const mmss = sek => `${Math.floor(sek / 60)}:${String(Math.max(0, Math.round(sek % 60))).padStart(2, "0")}`;
function zeitAnzeigen(){
  const el = document.getElementById("player"); if (!el) return;
  const z = el.querySelector(".pl-zeit"); if (!z) return;
  const dauern = PLAYER.segs.map(x => { const e = tonEintrag(x); return e ? e.l : Math.max(2, (x.saetze || []).join(" ").split(/\s+/).filter(Boolean).length / 2.5 + 1); });
  const gesamt = dauern.reduce((a, b) => a + b, 0);
  let bisher = dauern.slice(0, PLAYER.si).reduce((a, b) => a + b, 0);
  const e = tonEintrag(PLAYER.segs[PLAYER.si]);
  if (e && AUDIO && !AUDIO.paused) bisher += AUDIO.currentTime;
  else if (PLAYER.ti) bisher += dauern[PLAYER.si] * (PLAYER.ti / Math.max(1, (PLAYER.segs[PLAYER.si].saetze || []).length));

// Jeder Start bekommt eine Nummer. Alles, was später zurückkommt und eine alte Nummer trägt,
// wird verworfen – sonst reden zwei Abschnitte gleichzeitig, wenn man schnell weiterspringt.
const gueltig = lauf => PLAYER.spielt && PLAYER.lauf === lauf;
function stopp(){
  PLAYER.spielt = false; PLAYER.lauf++;
  clearTimeout(PLAYER.timer); clearInterval(PLAYER.wache); tickerStopp();
  wachHalten(false);
  try { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; } catch {}
  try { speechSynthesis.cancel(); } catch {}
  tonAus();
  knoepfe();
}
function tonAus(){
  if (!AUDIO) return;
  AUDIO.ontimeupdate = null; AUDIO.onended = null; AUDIO.onerror = null;
  try { AUDIO.pause(); } catch {}
}
// ---- Sperrbildschirm, Kopfhörer, Auto ----
// Solange eine echte Aufnahme läuft, zeigt das Handy Titel und Tasten an,
// auch wenn der Bildschirm aus ist. Ohne das ist die App im Hintergrund blind.
function medienSitzung(){
  if (!("mediaSession" in navigator)) return;
  const s = PLAYER.segs[PLAYER.si]; if (!s) return;
  const f = FORMATE[PLAYER.format] || {};
  const bild = (s.bilder || []).find(b => b && b.url);
  const symbol = new URL("icon-512.png", location.href).href;
  // Beim Vorspann steht der Sendungsname oben, sonst die Schlagzeile.
  const istRahmen = s.typ === "intro" || s.typ === "outro";
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: istRahmen ? (f.name || "Nachrichten-Heft") : (s.titel || f.name || "Nachrichten-Heft"),
      artist: istRahmen ? "Nachrichten-Heft · neutral" : (f.name || "Nachrichten-Heft"),
      album: "Nachrichten-Heft · neutral",
      artwork: [
        ...(bild ? [{ src: bild.url, sizes: "512x512", type: "image/jpeg" }] : []),
        { src: symbol, sizes: "512x512", type: "image/png" }
      ]
    });
  } catch {}
  try {
    navigator.mediaSession.playbackState = PLAYER.spielt ? "playing" : "paused";
    const setz = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
    setz("play",  () => { if (!PLAYER.spielt) abspielen(); });
    setz("pause", () => { if (PLAYER.spielt) stopp(); });
    setz("stop",  () => stopp());
    setz("nexttrack",     () => springen(PLAYER.si + 1));
    setz("previoustrack", () => springen(PLAYER.si - 1));
    setz("seekforward",   () => springen(PLAYER.si + 1));
    setz("seekbackward",  () => springen(PLAYER.si - 1));
  } catch {}
}
// Der Bildschirm soll während einer Sendung nicht einschlafen.
let WACH = null;
async function wachHalten(an){
  try {
    if (an){
      if (!WACH && navigator.wakeLock?.request) WACH = await navigator.wakeLock.request("screen");
    } else if (WACH){ await WACH.release(); WACH = null; }
  } catch { WACH = null; }
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && PLAYER.spielt) wachHalten(true);
});
function abspielen(){
  if (!PLAYER.segs.length) return;
  PLAYER.spielt = true;
  wachHalten(true); medienSitzung();
  if (PLAYER.fertig){ PLAYER.fertig = false; PLAYER.si = 0; PLAYER.ti = 0; PLAYER.melodieGespielt = false; zeigen(); }
  knoepfe();
  if (!PLAYER.stumm) tickerStart();
  const s = PLAYER.segs[PLAYER.si];
  const lauf = ++PLAYER.lauf;
  let warten = 0;
  if (!PLAYER.stumm && PLAYER.ti === 0 && !PLAYER.melodieGespielt && s.typ === "intro"){
    warten = PLAYER.format === "wissen" ? wissenMelodie() : melodie();
    PLAYER.melodieGespielt = true;
  }
  else if (!PLAYER.stumm && PLAYER.ti === 0 && s.eil && s.typ === "thema" && PLAYER.letzteEil !== s.id){ warten = eilSignal(); PLAYER.letzteEil = s.id; }
  if (warten > 0){
    clearTimeout(PLAYER.timer);
    PLAYER.timer = setTimeout(() => { if (gueltig(lauf)) losSprechen(); }, warten * 1000);
  } else losSprechen();
}
function springen(ziel){
  const lief = PLAYER.spielt;
  stopp();
  PLAYER.si = Math.max(0, Math.min(PLAYER.segs.length - 1, ziel));
  PLAYER.ti = 0; PLAYER.fertig = false;
  PLAYER.spielt = lief;
  zeigen();
  if (lief) losSprechen(); else knoepfe();
}
function naechstesSegment(){
  if (!PLAYER.spielt) return;
  tonAus();
  PLAYER.ti = 0; PLAYER.si++;
  if (PLAYER.si >= PLAYER.segs.length){
    PLAYER.si = PLAYER.segs.length - 1;
    PLAYER.ti = Math.max(0, (PLAYER.segs[PLAYER.si].saetze || []).length - 1);
    PLAYER.fertig = true;
    stopp();
    return;
  }
  const n = PLAYER.segs[PLAYER.si];
  if (!PLAYER.stumm && n.eil && n.typ === "thema" && PLAYER.letzteEil !== n.id){ PLAYER.letzteEil = n.id; eilSignal(); }
  if (!PLAYER.stumm && n.typ === "outro") schlussKlang(); else uebergang();
  const lauf = ++PLAYER.lauf;
  clearTimeout(PLAYER.timer);
  PLAYER.timer = setTimeout(() => { if (!gueltig(lauf)) return; zeigen(); losSprechen(); }, 820);
}
function losSprechen(){
  if (!PLAYER.spielt) return;
  const lauf = ++PLAYER.lauf;
  const s = PLAYER.segs[PLAYER.si];
  zeigenTeil(); knoepfe(); medienSitzung();
  if (!(s.saetze || []).length){          // stille Kapiteltafel
    clearTimeout(PLAYER.timer);
    PLAYER.timer = setTimeout(() => { if (gueltig(lauf)) naechstesSegment(); }, (s.standzeit || 2.6) * 1000);
    return;
  }
  clearInterval(PLAYER.wache);
  let e = null;
  try { e = tonEintrag(s); } catch { e = null; }
  try {
    if (e && AUDIO) tonSprechen(s, e, lauf); else geraetSprechen(s, lauf);
  } catch (err) {
    // Letzte Sicherung: lieber stumm weiterlaufen als für immer stehen bleiben.
    console.warn("Abschnitt konnte nicht gesprochen werden:", err && err.message);
    clearTimeout(PLAYER.timer);
    PLAYER.timer = setTimeout(() => { if (gueltig(lauf)) naechstesSegment(); },
      Math.max(2500, ((s.saetze || []).join(" ").split(/\s+/).length) * 380));
  }
}
// echte Sprecherstimme: eine Aufnahme je Abschnitt, Untertitel und Bilder laufen mit
function tonSprechen(s, e, lauf){
  const umschalten = () => { if (gueltig(lauf)) geraetSprechen(s, lauf); };
  // Auch hier gilt: erst die Notbremse stellen, dann erst probieren.
  clearTimeout(PLAYER.timer);
  PLAYER.timer = setTimeout(() => { if (gueltig(lauf) && (!AUDIO || AUDIO.paused)) umschalten(); }, 5000);
  try {
    try { speechSynthesis.cancel(); } catch {}
    const url = tonBasis() + e.d;
    const start = (e.s && e.s[PLAYER.ti] != null) ? e.s[PLAYER.ti] : 0;
    tonAus();
    if (AUDIO.getAttribute("src") !== url){ AUDIO.setAttribute("src", url); AUDIO.load(); }
    const anSeineStelle = () => { try { if (Math.abs(AUDIO.currentTime - start) > 0.3) AUDIO.currentTime = start; } catch {} };
    if (AUDIO.readyState >= 1) anSeineStelle(); else AUDIO.addEventListener("loadedmetadata", anSeineStelle, { once:true });
    AUDIO.muted = PLAYER.stumm;
    // Wachhund: bleibt der Ton hängen (Funkloch, Datei bricht ab), geht es trotzdem weiter.
    let zuletzt = -1, steht = 0;
    clearInterval(PLAYER.wache);
    PLAYER.wache = setInterval(() => {
      if (!gueltig(lauf) || !AUDIO){ clearInterval(PLAYER.wache); return; }
      if (AUDIO.paused){ steht = 0; zuletzt = -1; return; }
      if (Math.abs(AUDIO.currentTime - zuletzt) < 0.05){
        if (++steht >= 6){ clearInterval(PLAYER.wache); umschalten(); }
      } else { steht = 0; }
      zuletzt = AUDIO.currentTime;
    }, 1000);
    AUDIO.ontimeupdate = () => {
      if (!gueltig(lauf) || !e.s) return;
      let i = 0;
      while (i + 1 < e.s.length && AUDIO.currentTime >= e.s[i + 1] - 0.06) i++;
      if (i !== PLAYER.ti){ PLAYER.ti = i; zeigenTeil(); }
      zeitAnzeigen();
    };
    AUDIO.onended = () => { clearInterval(PLAYER.wache); if (gueltig(lauf)) naechstesSegment(); };
    AUDIO.onerror = umschalten;
    AUDIO.onstalled = () => { if (gueltig(lauf) && AUDIO.readyState < 2) umschalten(); };
    const versuch = AUDIO.play();
    if (versuch && versuch.catch) versuch.catch(umschalten);
    tonVorladen(PLAYER.si + 1);
  } catch (err) {
    console.warn("Tonaufnahme nicht abspielbar:", err && err.message);
    umschalten();
  }
}
function tonVorladen(i){
  const s = PLAYER.segs[i]; if (!s) return;
  const e = tonEintrag(s); if (!e) return;
  try { fetch(tonBasis() + e.d, { cache:"force-cache" }).catch(() => {}); } catch {}
}
// Rückfallebene: Vorlesestimme des Geräts, Satz für Satz
function geraetSprechen(s, lauf){
  if (!gueltig(lauf)) return;
  tonAus();
  const satz = (s.saetze || [])[PLAYER.ti] || "";
  const lesezeit = Math.max(1800, satz.split(/\s+/).length * 400);
  const weiter = () => {
    if (!gueltig(lauf)) return;
    PLAYER.ti++;
    if (PLAYER.ti >= (s.saetze || []).length) return naechstesSegment();
    zeigenTeil();
    geraetSprechen(s, lauf);
  };
  let fertig = false;
  const ende = () => {
    if (fertig || !gueltig(lauf)) return;
    fertig = true;
    clearTimeout(PLAYER.timer);
    PLAYER.timer = setTimeout(weiter, 420);
  };
  // Die Notbremse wird IMMER zuerst gestellt. Egal was beim Vorlesen schiefgeht –
  // spätestens danach geht es weiter. Vorher stand das Video hier für immer still.
  const nurLesen = PLAYER.stumm || !("speechSynthesis" in window) || typeof SpeechSynthesisUtterance !== "function";
  clearTimeout(PLAYER.timer);
  PLAYER.timer = setTimeout(nurLesen ? weiter : ende, nurLesen ? lesezeit + 500 : lesezeit * 2.6 + 3500);
  if (nurLesen) return;

  try {
    const v = stimmeWaehlen();
    const grundTempo = FORMATE[PLAYER.format]?.rate || 0.9;
    const teile = sprechTeile(satz);
    try { speechSynthesis.cancel(); } catch {}
    teile.forEach((teil, i) => {
      const u = new SpeechSynthesisUtterance(teil);
      u.lang = "de-DE"; if (v) u.voice = v;
      u.rate = grundTempo + (i % 2 ? 0.03 : -0.02) + (PLAYER.ti % 3) * 0.01;
      u.pitch = 0.94 + (i === teile.length - 1 ? -0.04 : 0.02);
      u.volume = 1;
      if (i === teile.length - 1){ u.onend = ende; u.onerror = ev => { if (ev.error !== "interrupted" && ev.error !== "canceled") ende(); } }
      speechSynthesis.speak(u);
    });
  } catch (e) {
    // Vorlesen klappt auf diesem Gerät nicht – dann eben still weiterlaufen.
    console.warn("Vorlesestimme nicht verfügbar:", e && e.message);
    clearTimeout(PLAYER.timer);
    PLAYER.timer = setTimeout(weiter, lesezeit + 500);
  }
}
function steuern(a){
  const P = PLAYER;
  if (a === "play") return P.spielt ? stopp() : abspielen();
  if (a === "weiter") return springen(P.si + 1);
  if (a === "zurueck"){
    // wie bei jedem Abspielgerät: erst an den Anfang des Abschnitts, beim zweiten Tippen zurück
    const weitDrin = P.ti > 0 || (AUDIO && !AUDIO.paused && AUDIO.currentTime > 3);
    return springen(weitDrin ? P.si : P.si - 1);
  }
  if (a === "ton"){
    P.stumm = !P.stumm;
    if (AUDIO) AUDIO.muted = P.stumm;
    if (P.stumm){ try { speechSynthesis.cancel(); } catch {} tickerStopp(); }
    else if (P.spielt) tickerStart();
    // die Vorlesestimme kann man nicht stummschalten, also den Abschnitt neu starten
    if (P.spielt && !(AUDIO && !AUDIO.paused)){ const i = P.si; springen(i); return; }
    knoepfe();
    return;
  }
  if (a === "ut"){ P.untertitel = !P.untertitel; untertitel(); knoepfe(); return; }
  if (a === "voll") return vollbild();
}
function vollbild(){
  const el = document.getElementById("player"); if (!el) return;
  if (el.classList.contains("voll")) return vollbildBeenden();

  // Das echte Vollbild gilt dem ganzen Spieler, nicht nur der Bühne – sonst wären
  // die Bedienknöpfe weg. Klappt es nicht (Apple), reicht unser eigenes völlig.
  const echt = el.requestFullscreen || el.webkitRequestFullscreen;
  if (echt){
    try { const p = echt.call(el); if (p && p.catch) p.catch(() => {}); } catch {}
  }
  // Auf Android lässt sich der Bildschirm wirklich drehen. Apple ignoriert das still.
  try { screen.orientation?.lock?.("landscape")?.catch?.(() => {}); } catch {}
  el.classList.add("voll");
  drehungPruefen();
  addEventListener("resize", drehungPruefen);
  vollKnopf();
}
function vollbildBeenden(){
  const el = document.getElementById("player");
  removeEventListener("resize", drehungPruefen);
  try { screen.orientation?.unlock?.(); } catch {}
  if (document.fullscreenElement){ try { document.exitFullscreen().catch(() => {}); } catch {} }
  if (el){ el.classList.remove("voll", "gedreht"); el.querySelector(".pl-drehhinweis")?.remove(); }
  vollKnopf();
}
// Handy hochkant, Video im Querformat? Dann drehen wir das Bild, statt es zu quetschen.
function drehungPruefen(){
  const el = document.getElementById("player"); if (!el || !el.classList.contains("voll")) return;
  const buehne = el.querySelector(".pl-buehne");
  const querFormat = buehne && !buehne.classList.contains("hoch");
  const hochGehalten = innerHeight > innerWidth * 1.08;
  const drehen = !!(querFormat && hochGehalten);
  if (drehen === el.classList.contains("gedreht")) return;
  el.classList.toggle("gedreht", drehen);
  el.querySelector(".pl-drehhinweis")?.remove();
  if (drehen){
    const h = document.createElement("div");
    h.className = "pl-drehhinweis";
    h.textContent = "Handy quer halten";
    buehne.appendChild(h);
  }
  shotZeigen(true);
}
function vollKnopf(){
  const el = document.getElementById("player"); if (!el) return;
  const an = el.classList.contains("voll");
  const k = el.querySelector('[data-a="voll"]');
  if (k){
    k.innerHTML = an ? SYM.vollAus : SYM.voll;
    k.setAttribute("aria-label", an ? "Vollbild beenden" : "Vollbild");
    k.classList.toggle("an", an);
  }
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

function sendungsLeiste(){
  const heute = berlin(new Date(), { year:"numeric", month:"2-digit", day:"2-digit" }).split(".").reverse().join("-");
  const heutige = AUSGABEN.filter(a => a.id.startsWith(heute)).slice(0, 5);
  if (!heutige.length) return "";
  return `<section class="videos"><h2 class="abschnitt">Sendungen <small>· nächste ${esc(naechsteSendung())}</small></h2>
    <div class="vreihe">${heutige.map(a => `<a class="vkarte sendung" href="#/video/ausgabe/${esc(a.id)}">
      <span class="vk-text"><b>▶ ${esc(a.name)}</b><small>${esc(berlin(new Date(a.zeit), { hour:"2-digit", minute:"2-digit" }))} Uhr · ${a.anzahl} Themen</small></span></a>`).join("")}</div></section>`;
}
function kurzvideoLeiste(){
  const segs = segmenteBauen("kurzvideo");
  if (segs.length < 3) return "";
  const b = segs.find(x => x.bilder?.length)?.bilder[0];
  return `<a class="kurzvideo-band" href="#/video/kurzvideo">
    <span class="kv-hoch">${b?.url ? `<img src="${esc(b.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <i class="kv-play">▶</i></span>
    <span class="kv-text"><b>Kurzvideos</b><small>${segs.length} Themen in einfacher Sprache · hochwischen fürs nächste</small></span>
    <span class="kv-pfeil">›</span></a>`;
}
function videoLeiste(){
  const liste = [
    ["100s", "▶ Heft in 100 Sekunden"], ["haupt", "▶ Hauptausgabe"], ["einfach", "▶ Einfach erklärt"], ["kurzmeldungen", "▶ Kurzmeldungen"]
  ].concat(wocheZeigen() ? [["woche", "▶ Wochenrückblick"]] : []);
  const karten = liste.map(([f, t]) => {
    const segs = segmenteBauen(f);
    if (segs.length < 3) return "";
    const bild = segs.find(s => s.bilder?.length)?.bilder[0];
    return `<a class="vkarte" href="#/video/${f}">${bild ? `<img src="${esc(bild.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <span class="vk-text"><b>${t}</b><small>ca. ${dauerText(dauerSek(segs))} · ${segs.filter(s => s.typ === "thema").length} Themen</small></span></a>`;
  }).join("");
  return karten ? `<section class="videos"><h2 class="abschnitt">Videos</h2><div class="vreihe">${karten}</div></section>` : "";
}

/* ---------- Navigation ---------- */
function route(){
  const h = decodeURIComponent(location.hash || "#/");
  let m;
  if ((m = h.match(/^#\/video\/(tief|rubrik)\/(.+)$/))) {
    if (!$app.innerHTML.trim() || $app.querySelector(".laden")) startseite("Alle");
    if (m[1] === "tief" && !NACHRICHTEN.find(x => x.id === m[2])) { detailSuchen(m[2]).then(() => playerOeffnen("tief", m[2])); return; }
    playerOeffnen(m[1], m[2]); return;
  }
  if ((m = h.match(/^#\/video\/clip\/(.+)$/))) { if (!document.getElementById("app").querySelector(".detail")) detailSuchen(m[1]).then(() => playerOeffnen("clip", m[1])); else playerOeffnen("clip", m[1]); return; }
  if ((m = h.match(/^#\/video\/ausgabe\/([\w-]+)$/))) {
    const id = m[1];
    if (!$app.innerHTML.trim() || $app.querySelector(".laden")) startseite("Alle");
    if (AUSGABE_DATEN[id]) playerOeffnen("ausgabe", id);
    else ladeJson(`data/ausgaben/${id}.json`).then(r => { AUSGABE_DATEN[id] = r.d; playerOeffnen("ausgabe", id); }).catch(() => playerOeffnen("ausgabe", id));
    return;
  }
  if ((m = h.match(/^#\/video\/(doku)\/(.+)$/))) { if (!$app.innerHTML.trim()) wissenSeite(); playerOeffnen("doku", m[2]); return; }
  if ((m = h.match(/^#\/video\/(wissen)\/(.+)$/))) { if (!$app.innerHTML.trim()) wissenSeite(); playerOeffnen("wissen", m[2]); return; }
  if ((m = h.match(/^#\/video\/(100s|haupt|einfach|woche|kurzmeldungen|wetter|kurzvideo)$/))) { if (!$app.innerHTML.trim() || $app.querySelector(".laden")) startseite("Alle"); playerOeffnen(m[1]); return; }
  if (document.getElementById("player")) { stopp(); document.getElementById("player").remove(); document.body.style.overflow = ""; }
  if ((m = h.match(/^#\/n\/(.+)$/))) detailSuchen(m[1]);
  else if ((m = h.match(/^#\/r\/(.+)$/))) startseite(RUBRIKEN.find(r => slug(r) === m[1]) || "Alle");
  else if ((m = h.match(/^#\/archiv\?q=(.*)$/))) archivSeite(null, m[1]);
  else if ((m = h.match(/^#\/archiv\/(\d{4}-\d{2})$/))) archivSeite(m[1]);
  else if (h.startsWith("#/archiv")) archivSeite();
  else if (h.startsWith("#/eil")) eilSeite();
  else if ((m = h.match(/^#\/thema\/(.+)$/))) themenSeite(m[1]);
  else if ((m = h.match(/^#\/doku\/(.+)$/))) dokuDetail(m[1]);
  else if ((m = h.match(/^#\/wissen\/(.+)$/))) wissenDetail(m[1]);
  else if (h.startsWith("#/wissen")) wissenSeite();
  else if (h.startsWith("#/medien")) medienSeite();
  else if (h.startsWith("#/merkliste")) merklisteSeite();
  else if (h.startsWith("#/story")) storySeite();
  else if (h.startsWith("#/videos")) videoSeite();
  else if (h.startsWith("#/wetter-orte")) wetterOrteSeite();
  else if (h.startsWith("#/wetter-modelle")) wetterModelleSeite();
  else if (h.startsWith("#/wetter")) wetterSeite();
  else if (h.startsWith("#/podcast")) podcastSeite();
  else if (h.startsWith("#/abo")) aboSeite();
  else if (h.startsWith("#/uneinig")) uneinigSeite();
  else if (h.startsWith("#/mehr")) mehrSeite();
  else if (MODUS === "wetter") wetterSeite();
  else if (MODUS === "podcast") podcastSeite();
  else if (MODUS === "wissen") wissenSeite();
  else startseite("Alle");
  window.scrollTo(0,0);
  tabsMarkieren();
}
function tabsMarkieren(){
  const h = location.hash || "#/";
  const wo = h.startsWith("#/wetter-orte") ? "orte"
    : h.startsWith("#/wetter-modelle") ? "modelle"
    : h.startsWith("#/wetter") ? "wetter"
    : h.startsWith("#/abo") ? "abo"
    : h.startsWith("#/podcast") ? "podcast"
    : h.startsWith("#/doku") ? (MODUS === "wissen" ? "doku" : "wissen")
    : h.startsWith("#/videos") || h.startsWith("#/video/") ? "videos"
    : h.startsWith("#/archiv") ? "archiv"
    : h.startsWith("#/merkliste") ? "merkliste"
    : h.startsWith("#/wissen") ? "wissen"
    : h.startsWith("#/mehr") || h.startsWith("#/eil") || h.startsWith("#/medien") ? "mehr"
    : MODUS === "heft" ? "heft" : APP.leiste[0][1];
  document.querySelectorAll(".tableiste a").forEach(a => a.setAttribute("aria-current", a.dataset.t === wo ? "page" : "false"));
}
// Kopfzeile, Leiste und Farbe richten sich nach der Betriebsart.
function appEinrichten(){
  document.documentElement.dataset.app = MODUS;
  const marke = document.querySelector(".brand");
  if (marke){ marke.innerHTML = esc(APP.name) + (APP.zusatz ? ` <span>${esc(APP.zusatz)}</span>` : "");
    marke.setAttribute("href", APP.start); }
  document.title = APP.name + (APP.zusatz ? " " + APP.zusatz : "");
  const leiste = document.querySelector(".tableiste");
  if (leiste) leiste.innerHTML = APP.leiste
    .map(([ziel, k, sym, txt]) => `<a href="${ziel}" data-t="${k}"><span>${sym}</span>${txt}</a>`).join("");
  const mf = document.querySelector('link[rel="manifest"]');
  if (mf) mf.setAttribute("href", APP.manifest);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", APP.farbe));
  // Die Suche oben gehört nur ins Heft.
  const lupe = document.querySelector('.icon-btn[href="#/archiv"]');
  if (lupe && !istHeft) lupe.remove();
  // Der Stand oben gilt nur dort, wo es Nachrichten gibt.
  const stand = document.querySelector(".stand");
  if (stand && MODUS === "podcast") stand.remove();
}
appEinrichten();
addEventListener("hashchange", route);

function datenUebernehmen(res){
  DATEN = res.d; NACHRICHTEN = res.d.nachrichten || []; ausCache = res.ausCache;
  document.getElementById("stand").textContent = DATEN.stand ? fmtZeit(DATEN.stand) : "–";
  document.getElementById("naechste").textContent = "nächste " + naechsteAktualisierung();
  band();
}
$app.innerHTML = '<p class="laden">Nachrichten werden geladen …</p>';
ladeJson("data/news.json").then(res => {
  datenUebernehmen(res); route(); introZeigen(false);
  ladeJson("data/woche.json").then(w => { WOCHE = w.d; if (!location.hash || location.hash === "#/") route(); }).catch(() => {});
  ladeJson("data/doku.json").then(d => { DOKU = (d.d?.fertig || []).filter(x => x.kapitel?.length);
    DOKU_ARBEIT = d.d?.inArbeit || null;
    if (!location.hash || location.hash === "#/" || location.hash.startsWith("#/wissen") || location.hash.startsWith("#/doku") || location.hash.startsWith("#/video/doku")) route(); }).catch(() => {});
  ladeJson("data/wissen.json").then(w => { WISSEN = w.d?.stuecke || []; if (!location.hash || location.hash === "#/" || location.hash.startsWith("#/wissen") || location.hash.startsWith("#/video/wissen")) route(); }).catch(() => {});
  // Zwei Quellen: Folgen aus den Sendungen und die Gespräche.
  Promise.allSettled([ladeJson("data/podcast.json"), ladeJson("data/gespraeche.json")]).then(r => {
    PODCAST_FOLGEN = r.flatMap(x => x.status === "fulfilled" ? (x.value.d?.folgen || []) : [])
      .filter(f => f && f.d)
      .sort((a, b) => String(b.zeit || "").localeCompare(String(a.zeit || "")));
    if (MODUS === "podcast" || location.hash.startsWith("#/podcast")) route();
  });
  ladeJson("data/ausgaben/index.json").then(a => { AUSGABEN = a.d || []; if (!location.hash || location.hash === "#/") route(); }).catch(() => {});
}).catch(() => {
  $app.innerHTML = '<div class="empty"><strong>Die Nachrichten konnten nicht geladen werden.</strong><br>Bitte Internetverbindung prüfen und später erneut versuchen.</div>';
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  ladeJson("data/news.json").then(res => {
    const neu = res.d.stand !== DATEN.stand;
    datenUebernehmen(res); SUCHE = null;
    if (neu && !location.hash.startsWith("#/n/") && !location.hash.startsWith("#/archiv")) route();
  }).catch(() => band());
});

/* ---------- Installieren & offline ---------- */
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installAufforderung = e; if (!location.hash || location.hash === "#/") route(); });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ---------- Hell/Dunkel ---------- */
function setTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  try { t ? localStorage.setItem("heft-theme", t) : localStorage.removeItem("heft-theme"); } catch(e){}
}
try { const t = localStorage.getItem("heft-theme"); if (t) setTheme(t); } catch(e){}
try { const g = localStorage.getItem("heft-schrift"); if (g) document.documentElement.dataset.schrift = g; } catch(e){}
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  setTheme(cur === "dark" ? "light" : "dark");
};
