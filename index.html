<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachrichten-Heft · neutral</title>
<meta name="description" content="Neutrale Nachrichten: mehrere Medien verglichen und verständlich zusammengefasst.">
<meta name="theme-color" content="#0D2B55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nachrichten-Heft">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#0D2B55; --bar-2:#16407A; --bar-ink:#FFFFFF; --bar-muted:#B9C8DE;
  --bg:#FFFFFF; --surface:#F3F5F8; --card:#FFFFFF; --ink:#16202E; --muted:#5A6677; --line:#DCE2EA;
  --red:#C41E2E; --red-ink:#FFFFFF; --green:#1B7348; --green-bg:#E6F3EC;
  --yellow-bg:#FFF4C4; --yellow-line:#E0BE3A; --link:#16407A;
  --head:"Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar:#0A1C38; --bar-2:#143462; --bar-muted:#9FB2CE;
    --bg:#0F151D; --surface:#151E2A; --card:#18222F; --ink:#E6EBF1; --muted:#9BA8B8; --line:#2A3748;
    --red:#D8394A; --green:#5CC592; --green-bg:#16301F;
    --yellow-bg:#352E12; --yellow-line:#8C7520; --link:#8DB4F0;
  }
}
:root[data-theme="dark"]{
  --bar:#0A1C38; --bar-2:#143462; --bar-muted:#9FB2CE;
  --bg:#0F151D; --surface:#151E2A; --card:#18222F; --ink:#E6EBF1; --muted:#9BA8B8; --line:#2A3748;
  --red:#D8394A; --green:#5CC592; --green-bg:#16301F;
  --yellow-bg:#352E12; --yellow-line:#8C7520; --link:#8DB4F0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--link)}
:focus-visible{outline:3px solid #F2B600;outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Leiste */
header.bar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{font-family:var(--head);font-weight:800;font-size:1.22rem;letter-spacing:-.01em;color:#fff;text-decoration:none;line-height:1.1}
.brand span{font-weight:600;color:var(--bar-muted)}
.stand{font-family:var(--head);font-size:.82rem;color:var(--bar-muted);text-align:right;line-height:1.25}
.stand b{color:#fff;font-weight:700;display:block;font-size:.95rem}
._alt{background:var(--bar-2);border:0;color:#fff;border-radius:999px;width:40px;height:40px;font-size:1.05rem;cursor:pointer;flex:none}

/* Rubriken */
nav.rubriken{background:var(--bar);border-top:1px solid rgba(255,255,255,.1)}
nav.rubriken .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:10px;scrollbar-width:none}
nav.rubriken .wrap::-webkit-scrollbar{display:none}
.chip{font-family:var(--head);font-weight:600;font-size:.95rem;white-space:nowrap;border:0;border-radius:999px;padding:9px 16px;min-height:42px;background:transparent;color:var(--bar-muted);cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:var(--bar)}

main{padding:18px 0 48px}

/* Eilmeldung */
.eil{display:block;text-decoration:none;background:var(--red);color:var(--red-ink);border-radius:12px;padding:16px 18px 18px;margin-bottom:22px}
.eil-label{font-family:var(--head);font-weight:800;font-size:.8rem;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.eil-label i{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;animation:puls 1.6s ease-in-out infinite}
@keyframes puls{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.eil-label i{animation:none}}
.eil h2{font-family:var(--head);font-weight:700;font-size:1.35rem;line-height:1.2;margin:6px 0 4px}
.eil p{margin:0;font-size:.95rem;opacity:.92}

/* Liste */
.list{display:flex;flex-direction:column;gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-family:var(--head);font-size:.84rem;color:var(--muted)}
.meta .rub{color:var(--link);font-weight:700}
.check{color:var(--green);background:var(--green-bg);border-radius:999px;padding:2px 9px;font-weight:600}
.eil-tag{background:var(--red);color:#fff;border-radius:4px;padding:1px 7px;font-weight:700;font-size:.75rem}
.card h3{font-family:var(--head);font-weight:700;font-size:1.3rem;line-height:1.2;margin:8px 0 6px;letter-spacing:-.005em}
.card p{margin:0;color:var(--ink)}
.empty{background:var(--surface);border-radius:12px;padding:22px;color:var(--muted)}
.empty strong{color:var(--ink);font-family:var(--head)}

/* Über */
details.about{margin-top:28px;background:var(--surface);border-radius:12px;padding:4px 18px}
details.about summary{font-family:var(--head);font-weight:700;cursor:pointer;padding:12px 0;min-height:44px}
details.about p{margin:0 0 12px;font-size:.95rem}

/* Detail */
.back{font-family:var(--head);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.detail h1{font-family:var(--head);font-weight:800;font-size:clamp(1.65rem,5vw,2.25rem);line-height:1.12;letter-spacing:-.015em;margin:16px 0 10px}
.detail .lead{font-size:1.12rem;font-weight:600;margin:0 0 6px}
.update{font-family:var(--head);font-size:.85rem;color:var(--muted);margin:6px 0 0}
section.block{margin-top:30px}
section.block h2{font-family:var(--head);font-weight:700;font-size:1.25rem;line-height:1.25;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bar-2)}
section.block p{margin:0 0 14px}
ul.facts{list-style:none;margin:0;padding:0}
ul.facts li{position:relative;padding:10px 0 10px 32px;border-bottom:1px solid var(--line)}
ul.facts li:last-child{border-bottom:0}
ul.facts li::before{content:"✓";position:absolute;left:4px;top:10px;color:var(--green);font-weight:700;font-family:var(--head)}
.unklar{background:var(--yellow-bg);border-left:5px solid var(--yellow-line);border-radius:0 10px 10px 0;padding:6px 18px}
.unklar ul{margin:0;padding:0;list-style:none}
.unklar li{padding:10px 0;border-bottom:1px solid var(--yellow-line)}
.unklar li:last-child{border-bottom:0}
.src{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.src-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.src-name{font-family:var(--head);font-weight:800;font-size:1.12rem}
.typ{font-family:var(--head);font-size:.8rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.src-date{font-family:var(--head);font-size:.82rem;color:var(--muted)}
.fokus{font-family:var(--head);font-size:.92rem;margin:8px 0 4px}
.fokus b{color:var(--muted);font-weight:600}
.src p{margin:0 0 10px;font-size:.98rem}
.src a.orig{font-family:var(--head);font-weight:700;font-size:.95rem;display:inline-block;padding:6px 0;min-height:40px}
.aussen{font-family:var(--head);font-size:.78rem;color:var(--muted);font-style:normal}
.diff{margin:0;padding:0;list-style:none}
.diff li{padding:12px 0;border-bottom:1px solid var(--line)}
.diff li:last-child{border-bottom:0}
.diff b{font-family:var(--head);display:block;font-size:1rem;margin-bottom:2px}
.original{font-size:.92rem;color:var(--muted);margin-top:4px}
.bottom-back{margin-top:32px}
.belege{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.beleg{font-family:var(--head);font-size:.74rem;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 8px}
.pos{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:var(--card)}
.pos-wer{font-family:var(--head);font-weight:700;font-size:1rem}
.pos p{margin:4px 0 2px}
.pos-q{font-family:var(--head);font-size:.8rem;color:var(--muted)}
.fehlend{font-size:.95rem;background:var(--surface);border-radius:10px;padding:12px 16px;margin-top:6px}
.fehlend b{font-family:var(--head)}
.check-box{background:var(--surface);border-radius:12px;padding:14px 18px;margin-top:30px}
.check-box h2{font-family:var(--head);font-size:1.05rem;margin:0 0 8px}
.check-box ul{list-style:none;margin:0;padding:0;font-size:.95rem}
.check-box li{padding:4px 0 4px 28px;position:relative}
.check-box li span{position:absolute;left:0;font-family:var(--head);font-weight:700}
.ok{color:var(--green)} .warn{color:#B07A00}
:root[data-theme="dark"] .warn{color:#E8B93A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#E8B93A}}
.push{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:var(--card)}
.push b{font-family:var(--head)}
.push p{margin:6px 0;font-size:.95rem}
.push code{display:inline-block;font-size:1rem;background:var(--surface);padding:6px 10px;border-radius:8px;word-break:break-all;user-select:all}
.laden{color:var(--muted);padding:30px 0;font-family:var(--head)}
footer{font-family:var(--head);font-size:.8rem;color:var(--muted);padding:0 0 32px}
.icon-btn{background:var(--bar-2);border:0;color:#fff;border-radius:999px;width:40px;height:40px;font-size:1.05rem;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.hinweisband{font-family:var(--head);font-size:.88rem;background:var(--yellow-bg);color:var(--ink);border-bottom:1px solid var(--yellow-line)}
.hinweisband .wrap{padding-top:8px;padding-bottom:8px}
.suchfeld{width:100%;font:inherit;font-size:1.05rem;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.seiten-titel{font-family:var(--head);font-weight:800;font-size:1.7rem;margin:18px 0 12px}
.monate{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.monat{font-family:var(--head);font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center}
.treffer-info{font-family:var(--head);font-size:.9rem;color:var(--muted);margin:14px 0 10px}
.archiv-hinweis{font-family:var(--head);font-size:.85rem;background:var(--surface);border-radius:8px;padding:6px 12px;display:inline-block;margin-top:14px}
.lernen dl{margin:0}
.lernen dt{font-family:var(--head);font-weight:700;margin-top:10px}
.lernen dd{margin:2px 0 0}
.lernen h3{font-family:var(--head);font-size:1.05rem;margin:22px 0 8px}
.lernen ol{margin:0;padding-left:22px}
.lernen ol li{margin-bottom:8px}
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.quiz-frage{font-family:var(--head);font-weight:700;margin-bottom:8px}
.quiz button{display:block;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;margin:6px 0;min-height:46px;cursor:pointer}
.quiz button.richtig{border-color:var(--green);background:var(--green-bg)}
.quiz button.falsch{border-color:var(--red)}
.quiz .erkl{font-size:.95rem;margin-top:8px}
.check-box details{margin-top:8px;font-size:.92rem}
.check-box summary{cursor:pointer;font-family:var(--head);font-weight:600}
.melden{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.melden form{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.melden select,.melden textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink)}
.melden textarea{min-height:110px;resize:vertical}
.btn{font-family:var(--head);font-weight:700;font-size:1rem;border:0;border-radius:999px;padding:11px 20px;min-height:46px;cursor:pointer;background:var(--bar-2);color:#fff}
.btn.hell{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.status{font-family:var(--head);font-size:.92rem}
.abschnitt{font-family:var(--head);font-size:1.1rem;margin:0 0 10px}
.videos{margin:0 0 22px}
.vreihe{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vkarte{flex:0 0 210px;scroll-snap-align:start;position:relative;height:120px;border-radius:12px;overflow:hidden;background:var(--bar);color:#fff;text-decoration:none;display:flex;align-items:flex-end}
.vkarte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.vk-text{position:relative;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(0,0,0,.55));width:100%}
.vk-text b{font-family:var(--head);font-size:1rem}
.vk-text small{font-family:var(--head);font-size:.78rem;opacity:.85}
/* Nachrichtenkarte: großes Bild oben, darunter Zeile, Überschrift, Vorspann */
.card{display:block;padding:0;overflow:hidden}
.card .ktext{padding:14px 16px 16px}
.kbild{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface);--akzent:#16407A}
.kbild img{width:100%;height:100%;object-fit:cover;display:block}
.kbild.tafel,.kbild.karte{background:linear-gradient(140deg,#0E2F5C,#0A1F3C)}
.kbild.tafel::before,.kbild.karte::before{content:"";position:absolute;inset:0;
  background:radial-gradient(110% 120% at 6% -10%,var(--akzent) 0%,rgba(0,0,0,0) 62%),
             repeating-linear-gradient(118deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,0) 2px 10px);opacity:.75}
.kb-inhalt{position:absolute;inset:0}
.kb-zahl,.kb-marke{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);color:#fff;z-index:2}
.kb-zahl b{display:block;font-family:var(--head);font-weight:800;line-height:1;font-size:clamp(1.5rem,7vw,2.4rem);
  font-variant-numeric:tabular-nums}
.kb-zahl span{display:block;margin-top:.4em;font-family:var(--head);font-size:.82rem;color:#C7D6E8}
.kb-marke b{display:inline-block;font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  font-size:.72rem;background:var(--akzent);padding:4px 10px;border-radius:4px}
.kb-marke span{display:block;margin-top:10px;font-family:var(--head);font-size:.92rem;color:#D7E2F0}
.kb-marke small{display:block;margin-top:3px;font-family:var(--head);font-size:.76rem;color:#9FB3CC}
.kb-gross{position:absolute;right:-2%;bottom:-14%;z-index:1;font-family:var(--head);font-weight:800;
  font-size:4.6rem;line-height:.8;letter-spacing:-.04em;color:rgba(255,255,255,.07);white-space:nowrap;pointer-events:none}
.kbild .karte{position:absolute;inset:0;width:100%;height:100%}
.kbild .karte .k-meer{fill:#0B2140}
.kbild .karte .k-land path{fill:#23558F;stroke:#0A2246;stroke-width:1.2}
.kb-ort{position:absolute;left:5%;bottom:8%;z-index:2;color:#fff;font-family:var(--head);font-weight:800;
  font-size:clamp(.95rem,4vw,1.3rem);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.kb-credit{position:absolute;right:6px;bottom:6px;z-index:2;font-family:var(--head);font-size:.58rem;color:#fff;
  background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- Vier Apps, vier Farben ---- */
html[data-app="wissen"]{--bar:#12512F;--bar-2:#1D7A4C;--link:#14603C}
html[data-app="wetter"]{--bar:#0E4F6E;--bar-2:#1C7CA6;--link:#0E5B7E}
html[data-app="podcast"]{--bar:#4A2A6B;--bar-2:#6D3FA8;--link:#54308C}
/* Schwester-Apps im Heft */
.schwestern{display:flex;flex-direction:column;gap:9px}
.schwester{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-left:4px solid var(--sf);border-radius:14px;padding:13px 15px;background:var(--card)}
.sw-sym{font-size:1.5rem;line-height:1}
.sw-text{flex:1;min-width:0}
.sw-text b{display:block;font-family:var(--head);font-size:1rem}
.sw-text small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px;line-height:1.35}
.sw-pfeil{color:var(--muted);font-size:1.3rem}
/* ---- Wetter-App ---- */
.w-sym{display:inline-block;vertical-align:middle;overflow:visible}
.wetter-jetzt{border-radius:18px;padding:20px 18px;margin:12px 0 4px;color:#fff;
  background:linear-gradient(160deg,var(--wf) 0%,color-mix(in srgb,var(--wf) 70%,#000) 100%)}
.wj-ort{font-family:var(--head);font-weight:800;font-size:1.3rem}
.wj-ort small{display:block;font-weight:400;font-size:.84rem;opacity:.75;margin-top:1px}
.wj-zahl{display:flex;align-items:center;gap:8px;margin:6px 0 0}
.wj-zahl b{font-family:var(--head);font-size:4rem;line-height:1;font-weight:800;letter-spacing:-.03em}
/* Die Symbolfarben galten bisher nur innerhalb der Wetterkarte - überall sonst
   blieben die Formen schwarz. Hier gelten sie für jedes .w-sym. */
.w-sym .w-sonne{fill:#F5B93C}
.w-sym .w-strahl{stroke:#F5B93C;stroke-width:2.2;stroke-linecap:round}
.w-sym .w-wolke{fill:#9DB4CC}
.w-sym .w-wolke2,.w-sym .w-nebel{stroke:#9DB4CC;stroke-width:2;stroke-linecap:round;fill:none}
.w-sym .w-nebel{opacity:.75}
.w-sym .w-regen{stroke:#3E9BD6;stroke-width:2.4;stroke-linecap:round;fill:none}
.w-sym .w-flocke path{stroke:#6FB6E8;stroke-width:1.6;stroke-linecap:round;fill:none}
.w-sym .w-blitz{fill:#E8A317}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .w-sym .w-wolke{fill:#C3D3E4}
  :root:not([data-theme="light"]) .w-sym .w-wolke2,
  :root:not([data-theme="light"]) .w-sym .w-nebel{stroke:#C3D3E4}
}
/* Im großen Kasten oben steht alles auf Farbe, da darf es heller sein. */
.wj-symbol .w-sym .w-sonne{fill:#FFD466}
.wj-symbol .w-sym .w-strahl{stroke:#FFD466}
.wj-symbol .w-sym .w-wolke{fill:#EAF1F8}
.wj-symbol .w-sym .w-wolke2,.wj-symbol .w-sym .w-nebel{stroke:#EAF1F8}
.wj-symbol .w-sym .w-regen{stroke:#9CD8FF}
.wj-symbol .w-sym .w-flocke path{stroke:#DCEEFF}
.wj-text{font-size:1rem;opacity:.9;margin-top:2px}
.wj-zeile{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
.wj-zeile div b{display:block;font-family:var(--head);font-size:1.05rem;font-weight:700}
.wj-zeile div span{display:block;font-size:.74rem;opacity:.75;margin-top:1px}
.wt-liste{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.wt-tag{display:flex;align-items:center;gap:8px;padding:9px 13px;border-top:1px solid var(--line)}
.wt-tag:first-child{border-top:0}
.wt-wann{flex:0 0 62px;font-family:var(--head);font-weight:700;font-size:.9rem}
.wt-wann small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.wt-sym{flex:0 0 36px;display:flex;justify-content:center}
.wt-regen{flex:0 0 34px;font-size:.74rem;color:var(--bar-2);font-family:var(--head);font-weight:700}
.wt-min,.wt-max{flex:0 0 32px;font-family:var(--head);font-weight:700;text-align:right}
.wt-min{color:var(--muted)}
.wt-spur{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;margin:0 6px}
.wt-spur i{position:absolute;top:0;bottom:0;border-radius:3px;
  background:linear-gradient(90deg,#4FA3D1,#E0A126)}
.wo-liste{display:flex;flex-direction:column;gap:8px}
.wo-ort{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--card);color:inherit;font:inherit}
.wo-ort.an{border-color:var(--bar-2);border-width:2px}
.wo-name{flex:1;font-family:var(--head);font-weight:700}
.wo-name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.wo-grad{font-family:var(--head);font-weight:800;font-size:1.2rem}
.wo-grad small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:5px}
.mv-ort{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:var(--card)}
.mv-ort > b{font-family:var(--head)}
.mv-spanne{float:right;font-family:var(--head);font-size:.74rem;font-weight:700;color:var(--muted)}
.mv-spanne.weit{color:#B07A12}
.w-fuss{font-size:.74rem;color:var(--muted);margin:14px 0 0}
/* ---- Podcast-App ---- */
.folge{border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;background:var(--card)}
.fo-kopf{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-family:var(--head);font-size:.74rem;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.fo-art{background:var(--bar-2);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.folge h3{font-family:var(--head);font-size:1.1rem;margin:0 0 6px;line-height:1.25}
.folge p{margin:0 0 8px;font-size:.93rem;line-height:1.45}
.fo-wer{color:var(--muted);font-size:.82rem}
.folge audio{width:100%;margin-top:6px}
.abo-feld{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;background:var(--card);margin:10px 0}
.abo-feld code{flex:1;min-width:0;word-break:break-all;font-size:.84rem}
/* Wettermodelle im Vergleich */
.modellvgl{border:1px solid var(--line);border-left:4px solid #E0A126;border-radius:14px;
  padding:13px 15px;margin:10px 0;background:var(--card)}
.modellvgl.einig{border-left-color:#2E9E63}
.mv-kopf{font-family:var(--head);font-weight:700;font-size:.98rem;margin-bottom:10px}
.mv-kopf small{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:2px}
.mv-reihe{display:flex;gap:10px;flex-wrap:wrap}
.mv-modell{flex:1 1 84px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 6px}
.mv-modell b{display:block;font-family:var(--head);font-size:1.3rem;line-height:1}
.mv-modell span{display:block;font-family:var(--head);font-size:.7rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.mv-modell i{display:block;font-style:normal;font-size:.72rem;color:var(--muted);margin-top:3px}
.mv-text{margin:10px 0 0;font-size:.9rem;line-height:1.4}
.mv-quelle{margin:8px 0 0;font-size:.74rem;color:var(--muted)}
/* Vergleichstafel in der Sendung */
.tf-vgl-gitter{display:flex;flex-direction:column;gap:.55em;margin-top:.5em}
.vgl-teil{display:block;padding:.5em .75em;border-radius:.45em;border-left:.28em solid}
.vgl-teil b{display:block;font-size:.62em;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  opacity:.85;margin-bottom:.22em}
.vgl-teil span{display:block;font-size:.92em;line-height:1.34;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vgl-teil.einig{border-left-color:#2E9E63;background:rgba(46,158,99,.14)}
.vgl-teil.offen{border-left-color:#E0A126;background:rgba(224,161,38,.14)}
.vgl-wer{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.55em}
.vgl-wer i{font-style:normal;font-size:.58em;font-weight:700;letter-spacing:.02em;opacity:.8;
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.16em .55em}
/* Medien-Siegel: die Zahl, die diese App von allen anderen unterscheidet */
.siegel{position:absolute;left:10px;top:10px;z-index:3;display:flex;align-items:center;gap:7px;
  background:rgba(8,18,32,.82);backdrop-filter:blur(4px);border-radius:10px;padding:5px 9px 5px 7px;
  box-shadow:0 2px 10px rgba(0,0,0,.35);border-left:3px solid #2E9E63}
.siegel.mit-offen{border-left-color:#E0A126}
.si-zahl{font-family:var(--head);font-weight:800;font-size:1.28rem;color:#fff;line-height:1}
.si-wort{font-family:var(--head);font-size:.56rem;font-weight:700;line-height:1.12;color:#C7D6E8;
  text-transform:uppercase;letter-spacing:.04em}
.si-offen{font-family:var(--head);font-size:.58rem;font-weight:800;color:#0F1B2B;background:#E0A126;
  padding:2px 5px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
/* Ansicht "Wo sie sich uneinig sind" */
.uneinig-band{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-left:4px solid #E0A126;border-radius:14px;
  padding:13px 15px;margin:10px 0;background:var(--card)}
.uneinig-band b{display:block;font-family:var(--head);font-size:1rem}
.uneinig-band small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px;line-height:1.35}
.uneinig-band .ub-pfeil{margin-left:auto;color:var(--muted);font-size:1.3rem}
.streit{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:12px 0;background:var(--card)}
.streit .st-kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.streit .st-rub{font-family:var(--head);font-size:.72rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.streit h3{font-family:var(--head);font-size:1.05rem;margin:0 0 10px;line-height:1.25}
.streit .st-zeile{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.streit .st-marke{flex:0 0 auto;font-family:var(--head);font-size:.62rem;font-weight:800;
  padding:3px 7px;border-radius:5px;height:fit-content;letter-spacing:.03em;white-space:nowrap}
.streit .st-marke.einig{background:#E3F3EA;color:#14603C}
.streit .st-marke.offen{background:#FBEFD6;color:#7A5410}
.streit .st-text{font-size:.93rem;line-height:1.42}
.st-wer{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.st-wer i{font-style:normal;font-family:var(--head);font-size:.64rem;font-weight:700;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
@media (prefers-color-scheme:dark){
  .streit .st-marke.einig{background:#123A27;color:#7FD3A6}
  .streit .st-marke.offen{background:#3C2E10;color:#EBC478}
}
/* Abspielknopf auf einer Kachel */
.kbild-huelle{position:relative;display:block}
.kb-play{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:7px;
  background:rgba(8,18,32,.74);padding:5px 10px 5px 5px;border-radius:999px;backdrop-filter:blur(3px);
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
.kb-play-kreis{width:26px;height:26px;border-radius:50%;background:#fff;color:#0D2B55;display:flex;
  align-items:center;justify-content:center;font-size:.68rem;padding-left:2px}
.kb-play b{font-family:var(--head);font-size:.72rem;font-weight:700;color:#fff;letter-spacing:.01em}
/* In Arbeit: zeigt an, dass eine lange Doku entsteht */
.in-arbeit{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;
  padding:13px 15px;margin:10px 0 4px;background:var(--card)}
.in-arbeit .ia-text{flex:1;min-width:0}
.in-arbeit b{display:block;font-family:var(--head);font-size:.95rem}
.in-arbeit small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;line-height:1.35}
.ia-balken{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.ia-balken i{display:block;height:100%;background:#1D7A4C;border-radius:3px}
.card h3{margin:8px 0 6px}
.hero{position:relative;margin:16px 0 8px;border-radius:14px;overflow:hidden;background:var(--bar);aspect-ratio:16/9}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .tafel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;color:rgba(255,255,255,.18);font-size:clamp(2rem,9vw,4rem);text-align:center;padding:10px}
.hero-play{position:absolute;left:14px;bottom:14px;font-family:var(--head);font-weight:700;background:rgba(0,0,0,.72);color:#fff;border:0;border-radius:999px;padding:10px 18px;min-height:46px;cursor:pointer;font-size:1rem}
.bildnachweis{font-family:var(--head);font-size:.76rem;color:var(--muted);margin:0 0 6px}
.bildnachweis a{color:inherit}
.stufen{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;margin:18px 0 4px}
.stufen button{font-family:var(--head);font-weight:700;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer}
.stufen button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.wfragen{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wfragen h2{font-family:var(--head);font-size:1rem;margin:0;padding:10px 16px;background:var(--bar);color:#fff}
.wfragen dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.wfragen dt,.wfragen dd{margin:0;padding:9px 14px;border-top:1px solid var(--line)}
.wfragen dt{font-family:var(--head);font-weight:700;background:var(--surface);white-space:nowrap}
.wfragen dd.offen{color:var(--muted);font-style:italic}
.artikel h3{font-family:var(--head);font-size:1.15rem;margin:24px 0 8px}
.zeitleiste{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--bar-2)}
.zeitleiste li{position:relative;padding:4px 0 12px 12px}
.zeitleiste li::before{content:"";position:absolute;left:-26px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--bar-2)}
.zeitleiste b{font-family:var(--head);display:block;font-size:.9rem;color:var(--muted)}
#player{position:fixed;inset:0;z-index:100;background:#05080d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;outline:none}
.pl-kopf{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-family:var(--head);font-weight:700}
.pl-x{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;border:0;
  border-radius:999px;width:42px;height:42px;padding:0;cursor:pointer}
.pl-x svg{width:20px;height:20px}
.pl-x:hover{background:rgba(255,255,255,.22)}
.pl-buehne{position:relative;overflow:hidden;border-radius:12px;background:#0D2B55}
.pl-buehne.quer{width:min(96vw,calc((100vh - 150px)*16/9));aspect-ratio:16/9}
.pl-buehne.hoch{height:min(calc(100vh - 150px),calc(96vw*16/9));aspect-ratio:9/16}
/* ---- Vollbild ----
   Immer selbst gebaut, damit die Bedienknöpfe mitkommen (im echten Vollbild der Bühne
   waren sie weg) und das Bild sein 16:9-Format behält statt in die Länge gezogen zu werden. */
#player.voll{padding:0;gap:0;justify-content:center;background:#000}
#player.voll .pl-drehhinweis{bottom:14px}
#player.voll .pl-kopf{background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));z-index:6;
  padding:max(10px,env(safe-area-inset-top)) 14px 22px}
/* Die Bedienleiste schwebt jetzt über dem Bild, also darf das Bild die volle Höhe nutzen. */
#player.voll .pl-buehne{border-radius:0;max-width:none;
  width:min(100vw, calc((100dvh - 62px) * 16 / 9));
  height:min(calc(100dvh - 62px), calc(100vw * 9 / 16));
  aspect-ratio:16/9}
#player.voll .pl-buehne.hoch{width:min(100vw, calc((100dvh - 62px) * 9 / 16));
  height:min(calc(100dvh - 62px), calc(100vw * 16 / 9));aspect-ratio:9/16}

/* Bedienleiste unter dem Bild statt darüber – sonst überdeckt sie Untertitel und Laufband.
   Dafür im Vollbild kompakter, damit dem Bild mehr Höhe bleibt. */
#player.voll .pl-steuer{width:100%;justify-content:center;background:#05080d;flex:0 0 auto;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
#player.voll .pl-steuer button{width:40px;height:40px}
#player.voll .pl-steuer .pl-haupt{width:50px;height:50px}
#player.voll .pl-steuer .pl-zeit{font-size:.8rem}
#player.voll .pl-marke,#player.voll .pl-credit{top:calc(46px + env(safe-area-inset-top))}
#player.voll .pl-bu{top:calc(72px + env(safe-area-inset-top))}
/* Hochkant gehaltenes Handy, Querformat-Video: den ganzen Spieler drehen,
   damit das Bild den Bildschirm füllt – Handy einfach quer halten. */
#player.voll.gedreht{inset:auto;top:50%;left:50%;width:100dvh;height:100dvw;
  transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}
#player.voll.gedreht .pl-buehne{width:min(100dvh, calc((100dvw - 62px) * 16 / 9));
  height:min(calc(100dvw - 62px), calc(100dvh * 9 / 16))}
.pl-drehhinweis{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:7;
  background:rgba(5,8,13,.82);color:#DCE6F2;font-family:var(--head);font-size:.78rem;font-weight:700;
  padding:7px 13px;border-radius:999px;white-space:nowrap;pointer-events:none;
  animation:drehweg .4s ease 4s forwards}
@keyframes drehweg{to{opacity:0;visibility:hidden}}
.pl-fortschritt{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.pl-fortschritt i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);cursor:pointer;
  transition:background .15s,transform .12s}
.pl-fortschritt i::after{content:"";position:absolute;top:-9px;bottom:-9px;left:0;right:0}
.pl-fortschritt i{position:relative}
.pl-fortschritt i:hover{background:rgba(255,255,255,.7);transform:scaleY(1.8)}
.pl-fortschritt i.fertig,.pl-fortschritt i.jetzt{background:#fff}
.pl-bild{position:absolute;inset:0}
.pl-bild img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.fahrt-zoom-in{animation:zoomIn 12s ease-out forwards}
.fahrt-zoom-out{animation:zoomOut 12s ease-out forwards}
.fahrt-pan-links{animation:panLinks 14s linear forwards}
.fahrt-pan-rechts{animation:panRechts 14s linear forwards}
@keyframes zoomIn{from{transform:scale(1.01)}to{transform:scale(1.10)}}
@keyframes zoomOut{from{transform:scale(1.10)}to{transform:scale(1.01)}}
@keyframes panLinks{from{transform:scale(1.10) translateX(2.5%)}to{transform:scale(1.10) translateX(-2.5%)}}
@keyframes panRechts{from{transform:scale(1.10) translateX(-2.5%)}to{transform:scale(1.10) translateX(2.5%)}}
@media (prefers-reduced-motion:reduce){.pl-bild img{animation:none}}
.pl-bild::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,30,.55) 0%,rgba(5,15,30,.1) 35%,rgba(5,15,30,.85) 100%)}
.pl-bild.tafel{background:linear-gradient(135deg,#0D2B55,#16407A)}
.pl-bild.tafel.gelb{background:linear-gradient(135deg,#5a4a10,#8C7520)}
.pl-bild.tafel.rot{background:linear-gradient(135deg,#7a1020,#C41E2E)}
.pl-credit{position:absolute;right:10px;top:22px;z-index:2;font-family:var(--head);font-size:clamp(.55rem,1.4vw,.72rem);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px;max-width:70%;text-align:right}
.pl-inhalt{position:absolute;left:0;right:0;bottom:22%;padding:0 5%;z-index:2;transition:bottom .2s}
.pl-buehne.mit-ut .pl-inhalt{bottom:calc(12% + var(--ut-hoehe,62px))}
.pl-buehne.hoch.mit-ut .pl-inhalt{bottom:calc(14% + var(--ut-hoehe,66px))}
.hoch .pl-inhalt{bottom:26%}
.pl-logo{font-family:var(--head);font-weight:800;font-size:clamp(.95rem,2.8vw,1.6rem)}
.pl-logo span{color:#B9C8DE;font-weight:600}
.pl-rubrik{font-family:var(--head);font-weight:700;font-size:clamp(.72rem,1.8vw,1rem);text-transform:uppercase;letter-spacing:.06em;color:#B9C8DE}
.pl-eil{background:#C41E2E;color:#fff;padding:1px 8px;border-radius:4px;margin-right:6px}
.pl-titel{font-family:var(--head);font-weight:800;font-size:clamp(1.1rem,3.6vw,2.3rem);line-height:1.12;margin:6px 0 10px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hoch .pl-titel{font-size:clamp(1.1rem,5.5vw,1.8rem)}
.rub.wissen{color:#1D7A4C}
.wissen-karte .ktext .meta .rub{color:#1D7A4C}
.mehr-zeile{margin:10px 0 0}
.mehr-zeile a{font-family:var(--head);font-weight:700;color:var(--akzent-link,#16407A)}
.quelle-kasten{margin:24px 0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.quelle-kasten h2{font-family:var(--head);font-size:1.05rem;margin:0 0 6px}
.quelle-kasten p{margin:0;color:var(--ink);font-size:.95rem;line-height:1.45}
.begriff{padding:10px 0;border-bottom:1px solid var(--line)}
.begriff b{display:block;font-family:var(--head)}
.begriff span{color:var(--muted);font-size:.95rem;line-height:1.4}
.seiten-text{color:var(--muted);line-height:1.5;margin-bottom:16px}
.kanaele{margin-top:26px}
.kanal-hinweis{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.kanal{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;background:var(--card)}
.kanal.wichtig{border-color:var(--red);border-width:2px}
.kanal-text{flex:1 1 auto;min-width:0}
.kanal-text b{display:block;font-family:var(--head);font-size:1.05rem}
.kanal-text span{display:block;color:var(--muted);font-size:.9rem;line-height:1.3;margin:2px 0 4px}
.kanal-text code{font-size:.76rem;color:var(--muted);word-break:break-all}
.kanal .btn{flex:0 0 auto;white-space:nowrap}
.pl-sprecher{font-family:var(--head);font-size:clamp(.68rem,1.7vw,.95rem);color:#C7D6E8;margin-top:2px}
.pl-sprecher b{color:#fff}
.pl-sprecher span{color:#9FB3CC}
.pl-inhalt.einblenden .pl-sprecher{animation:vonUnten .5s ease-out .25s both}
.pl-chips{display:flex;flex-wrap:wrap;gap:6px}
.pl-chips span{font-family:var(--head);font-size:clamp(.66rem,1.6vw,.9rem);background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px}
.pl-link{display:inline-block;margin-top:10px;font-family:var(--head);font-weight:700;color:#fff;font-size:clamp(.72rem,1.6vw,.95rem)}
.pl-ut{position:absolute;left:4%;right:4%;bottom:5%;z-index:2;text-align:center;font-family:var(--body);font-size:clamp(.85rem,2.2vw,1.35rem);line-height:1.35}
.pl-ut:not(:empty){background:rgba(0,0,0,.72);padding:6px 12px;border-radius:8px}
.pl-marke{position:absolute;left:10px;top:20px;z-index:2;font-family:var(--head);font-size:clamp(.55rem,1.4vw,.72rem);opacity:.8;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-start{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);color:#0D2B55;cursor:pointer;z-index:4;
  box-shadow:0 8px 28px rgba(0,0,0,.45);transition:transform .12s}
.pl-start svg{width:38px;height:38px;fill:currentColor;margin-left:3px}

             ["#/mehr", "mehr", "☰", "Mehr"]]

const MODUS = (() => {
  const p = new URLSearchParams(location.search).get("app");
  if (p && APPS[p]) { try { localStorage.setItem("heft-app", p); } catch {} return p; }
  try { const g = localStorage.getItem("heft-app"); if (g && APPS[g]) return g; } catch {}
  return "heft";
})();

const slug = r => r.toLowerCase().replace(/ & /g,"-").replace(/[^a-zäöü-]/g,"");

/* ---------- Daten laden ---------- */
function rawBasis(){
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  const repo = seg && !seg.includes(".") ? seg : h;
  return `https://raw.githubusercontent.com/${owner}/${repo}/main/`;
}
async function ladeJson(pfad){
  const basis = rawBasis();
  const urls = [basis && basis + pfad, pfad].filter(Boolean);
  for (const u of urls){
    try{
      const r = await fetch(u + "?t=" + Date.now(), { cache:"no-store" });
      if (r.ok){ const d = await r.json(); return { d, ausCache: r.headers.get("x-aus-cache") === "1" }; }
    }catch(e){}
  }
  throw new Error("nicht erreichbar: " + pfad);
}
async function ladeSuche(){
  if (SUCHE) return SUCHE;
  try { SUCHE = (await ladeJson("data/suche.json")).d; } catch { SUCHE = []; }
  return SUCHE;
}
async function ladeMonat(m){
  if (ARCHIV[m]) return ARCHIV[m];
  try { ARCHIV[m] = (await ladeJson(`data/archiv/${m}.json`)).d; } catch { ARCHIV[m] = []; }
  return ARCHIV[m];
}

/* ---------- Zeit ---------- */
const berlin = (d, opt) => new Intl.DateTimeFormat("de-DE", { timeZone:"Europe/Berlin", ...opt }).format(d);
const stundeBerlin = d => parseInt(new Intl.DateTimeFormat("en-GB", { timeZone:"Europe/Berlin", hour:"2-digit", hourCycle:"h23" }).format(d), 10);
function fmtZeit(iso, nurDatum){
  const d = new Date(iso), jetzt = new Date();
  const tag = x => berlin(x, { year:"numeric", month:"2-digit", day:"2-digit" });
  const uhr = berlin(d, { hour:"2-digit", minute:"2-digit" });
  if (tag(d) === tag(jetzt)) return nurDatum ? "Heute" : "Heute, " + uhr;
  if (tag(d) === tag(new Date(jetzt - 864e5))) return nurDatum ? "Gestern" : "Gestern, " + uhr;
  const jahr = berlin(d, { year:"numeric" }) !== berlin(jetzt, { year:"numeric" });
  const kurz = berlin(d, jahr ? { day:"2-digit", month:"2-digit", year:"numeric" } : { day:"2-digit", month:"2-digit" }).replace(/\.?$/, jahr ? "" : ".");
  return nurDatum ? kurz : kurz + ", " + uhr;
}
const monatName = m => { const [j,mo] = m.split("-"); return new Date(Date.UTC(+j, +mo-1, 15)).toLocaleDateString("de-DE", { month:"long", year:"numeric" }); };

/* ---------- Hinweisband (offline / veraltet) ---------- */
function band(){
  const el = document.getElementById("band"), t = document.getElementById("bandText");
  let text = "";
  if (!navigator.onLine || ausCache) text = "Offline – du siehst den zuletzt gespeicherten Stand.";
  else if (DATEN.stand){
    const std = (Date.now() - new Date(DATEN.stand)) / 36e5;
    const h = stundeBerlin(new Date());
    // Der Hinweis gilt den Nachrichten. In den anderen Apps wäre er nur verwirrend.
    const was = MODUS === "wetter" ? "Wetterdaten" : MODUS === "wissen" ? "Stücke" : MODUS === "podcast" ? "Folgen" : "Nachrichten";
    if (std > 3 && h >= 7 && h <= 22 && MODUS !== "podcast")
      text = `Hinweis: Die letzte Aktualisierung ist ${Math.floor(std)} Stunden her. Neue ${was} fehlen möglicherweise.`;
  }
  t.textContent = text; el.hidden = !text;
}
addEventListener("online", band); addEventListener("offline", band);

function etikett(n){
  if (n.eil) return "";
  if (n.artikel?.some(a => /verständnis|hintergrund/i.test(a.ueberschrift))) return '<span class="etikett">Hintergrund</span>';
  if (n.fakten?.length >= 3) return '<span class="etikett">Zahlen</span>';
  if (n.unklar?.length >= 3) return '<span class="etikett">Noch offen</span>';
  return "";
}
// Jede Nachricht bekommt ein Bild: Foto, sonst Ortskarte, sonst eine Grafiktafel aus den geprüften Daten
function kartenBild(n, gross){
  const b = (n.bildInfos && n.bildInfos[0]) || n.bildInfo || (n.bild && n.bild.url ? n.bild : null);
  const farbe = RUBRIK_FARBE[n.rubrik] || "#16407A";
  if (b && b.url){
    const quelle = b.urheber ? `<span class="kb-credit">Foto: ${esc(String(b.urheber).slice(0,40))} / Wikimedia${b.lizenz ? " · " + esc(b.lizenz) : ""}</span>` : "";
    return `<div class="kbild foto${gross ? " gross" : ""}" style="--akzent:${farbe}">
      <img src="${esc(b.url)}" alt="" loading="lazy" referrerpolicy="no-referrer"
           onerror="this.closest('.kbild').className='kbild tafel${gross ? " gross" : ""}';this.replaceWith(kartenErsatz(this.dataset.id))" data-id="${esc(n.id)}">${quelle}</div>`;
  }
  return `<div class="kbild ${n.ortInfo ? "karte" : "tafel"}${gross ? " gross" : ""}" style="--akzent:${farbe}">${kartenErsatzHTML(n)}</div>`;
}
function kartenErsatzHTML(n){
  if (n.ortInfo) return karteSVG(n.ortInfo, 46, 26, true, 0.5, 0.45) + `<span class="kb-ort">${esc(n.ortInfo.name)}</span>`;
  const f = (n.fakten || []).filter(x => Array.isArray(x) && x[0] && x[1])[0];
  if (f) return `<div class="kb-zahl"><b>${esc(String(f[1]).length > 16 ? String(f[1]).slice(0,16) + "…" : f[1])}</b><span>${esc(f[0])}</span></div>`;
  const anzahl = (n.medien || []).length;
  const wo = (n.wfragen?.wo && !/noch unklar/i.test(n.wfragen.wo)) ? n.wfragen.wo : "";
  return `<div class="kb-gross" aria-hidden="true">${esc(n.rubrik)}</div>
    <div class="kb-marke"><b>${esc(n.rubrik)}</b>${anzahl ? `<span>✓ ${anzahl} Medien verglichen</span>` : ""}${wo ? `<small>${esc(wo.length > 40 ? wo.slice(0,38) + "…" : wo)}</small>` : ""}</div>`;

// ---- "Wo sie sich uneinig sind" ----
// Das ist der Blick, den kein einzelnes Medium anbieten kann: nebeneinander,
// worin sich die Berichte decken und wo sie auseinandergehen.
function streitThemen(){
  return [...NACHRICHTEN]
    .filter(n => (n.unklar || []).length && (n.medien || []).length >= 2)
    .sort((a, b) => b.zeit.localeCompare(a.zeit));
}
function uneinigBand(){
  const liste = streitThemen();
  if (liste.length < 2) return "";
  return `<a class="uneinig-band" href="#/uneinig">
    <div><b>Wo sie sich uneinig sind</b>
    <small>${liste.length} Themen, bei denen die Medien auseinandergehen – nebeneinandergestellt.</small></div>
    <span class="ub-pfeil" aria-hidden="true">›</span></a>`;
}
function streitKarte(n){
  const einig = (n.einig || []).slice(0, 2);
  const offen = (n.unklar || []).slice(0, 2);
  return `<a class="streit" href="#/n/${esc(n.id)}" style="text-decoration:none;color:inherit;display:block">
    <div class="st-kopf"><span class="st-rub">${esc(n.rubrik)}</span>
      <span class="st-rub">${(n.medien || []).length} Medien verglichen</span></div>
    <h3>${esc(n.titel)}</h3>
    ${einig.map(e => {
      const text = Array.isArray(e) ? e[0] : e;
      const wer = Array.isArray(e) && Array.isArray(e[1]) ? e[1] : [];
      return `<div class="st-zeile"><span class="st-marke einig">Einig</span>
        <span class="st-text">${esc(text)}
        ${wer.length ? `<span class="st-wer">${wer.map(m => `<i>${esc(m)}</i>`).join("")}</span>` : ""}</span></div>`;
    }).join("")}
    ${offen.map(t => `<div class="st-zeile"><span class="st-marke offen">Offen</span>
      <span class="st-text">${esc(t)}</span></div>`).join("")}
  </a>`;
}
function uneinigSeite(){
  document.getElementById("rubNav").hidden = true;
  const liste = streitThemen();
  $app.innerHTML = `<a class="zurueck-link" href="#/">‹ Alle Nachrichten</a>
    <h1 class="seiten-titel">Wo sie sich uneinig sind</h1>
    <p class="seiten-text">Kein einzelnes Medium kann dir das zeigen – es wäre ja selbst eines davon.

         Das kommt vor – schau später noch einmal vorbei.</div>`}`;

}

const WTAG = d => { try { return new Intl.DateTimeFormat("de-DE", { weekday:"short" }).format(new Date(d)); } catch { return ""; } };
const WDATUM = d => { try { return new Intl.DateTimeFormat("de-DE", { day:"2-digit", month:"2-digit" }).format(new Date(d)); } catch { return ""; } };

function wetterOrt(){
  try { const g = localStorage.getItem("heft-ort"); if (g) return g; } catch {}
  return (DATEN.wetter?.orte?.[0]?.name) || "";
}
function wetterOrtSetzen(n){ try { localStorage.setItem("heft-ort", n); } catch {} wetterSeite(); window.scrollTo(0,0); }

function wetterSeite(){
  document.getElementById("rubNav").hidden = true;
  const w = DATEN.wetter;
  if (!w?.orte?.length){
    $app.innerHTML = `<div class="empty"><strong>Noch keine Wetterdaten.</strong><br>Beim nächsten Lauf sind sie da.</div>`;
    return;
  }
  const name = wetterOrt();
  const o = w.orte.find(x => x.name === name) || w.orte[0];
  const jetzt = o.jetzt || { grad: o.heute.max, code: o.heute.code };
  const tage = (o.tage && o.tage.length > 2) ? o.tage : [o.heute, o.morgen];
  const alleMax = tage.map(t => t.max), alleMin = tage.map(t => t.min);
  const hoch = Math.max(...alleMax), tief = Math.min(...alleMin);
  const balken = t => {
    const a = ((t.min - tief) / Math.max(1, hoch - tief)) * 100;
    const b = ((t.max - t.min) / Math.max(1, hoch - tief)) * 100;
    return `<span class="wt-spur"><i style="left:${a.toFixed(0)}%;width:${Math.max(6, b).toFixed(0)}%"></i></span>`;
  };

function startseite(rubrik){
  document.getElementById("rubNav").hidden = false;

  const liste = rubrik === "Alle" ? alle : alle.filter(n => n.rubrik === rubrik);
  const eil = alle.find(n => n.eil && Date.now() - new Date(n.zeit) < 24*36e5);
  let html = "";
  if (eil && rubrik === "Alle"){
    html += `<a class="eil" href="#/n/${esc(eil.id)}"><div class="eil-label"><i aria-hidden="true"></i>EILMELDUNG · ${esc(fmtZeit(eil.zeit))}</div>
      <h2>${esc(eil.titel)}</h2><p>${esc(eil.vorspann)}</p></a>`;
  }
  if (rubrik === "Alle") html += uneinigBand() + `<a class="story-start" href="#/story">📱 Schlagzeilen durchwischen (Story-Modus)</a>`
    + sendungsLeiste() + kurzvideoLeiste() + videoLeiste()
    + (istHeft ? schwesterBand() : wissenLeiste() + wetterLeiste());
  else if (liste.length >= 2) html += `<section class="videos"><div class="vreihe"><a class="vkarte sendung" href="#/video/rubrik/${slug(rubrik)}">
      <span class="vk-text"><b>▶ ${esc(rubrik)} als Video</b><small>${liste.length} Themen</small></span></a></div></section>`;
  html += liste.length ? `<div class="list">${liste.map(n => karte(n)).join("")}</div>`
    : `<div class="empty"><strong>Zurzeit keine Nachricht in „${esc(rubrik)}“.</strong><br>Ein Thema erscheint erst, wenn mehrere Medien vergleichbar darüber berichten. Ältere Nachrichten findest du im <a href="#/archiv">Archiv</a>.</div>`;
  if (rubrik === "Alle"){
    if (DATEN.ntfyTopic && !merker.hat("heft-eil")){
      html += `<a class="push-knopf" href="#/eil"><span class="pk-icon">🔔</span><span><b>Nachrichten aufs Handy</b><small>Ein Tipp auf „Erlauben“ – ohne zusätzliche App</small></span><span class="pk-pfeil">›</span></a>`;
    }
    if (!istInstalliert && (installAufforderung || istIOS)){
      html += `<div class="push"><b>📲 Als App installieren</b>
        ${installAufforderung ? `<p>Das Nachrichten-Heft bekommt ein eigenes Symbol und funktioniert auch ohne Internet.</p><button class="btn" id="installBtn">Jetzt installieren</button>`
          : `<p>Auf dem iPhone: unten auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm“</b>. Danach funktioniert die App auch ohne Internet.</p>`}</div>`;
    }
  }
  html += `<details class="about"><summary>So entsteht dieses Heft</summary>
    <p>Jede Stunde zwischen 6 und 22 Uhr werden die Nachrichten-Feeds von Tagesschau/ARD, ZDFheute, Deutschlandfunk, Spiegel, Zeit, Süddeutscher Zeitung, FAZ, Deutscher Welle und BBC gelesen. Ein Thema erscheint nur, wenn mindestens zwei Medien darüber berichten.</p>
    <p>Eine KI schreibt eine neutrale Zusammenfassung. Eine zweite KI-Prüfung gleicht jeden Satz mit den Originalberichten ab und korrigiert, was dort nicht steht. Unter „einig“ steht nur, was mindestens zwei Medien bestätigen. Aussagen von Beteiligten sind immer als Aussage gekennzeichnet.</p>
    <p><b>Grenzen:</b> Keine Nachrichten-App ist völlig neutral. Schon welche Themen und welche Medien ausgewählt werden, ist eine Entscheidung. Die KI kann trotz Prüfung Fehler machen – im Zweifel gilt der Originalbericht. Fehler kannst du bei jeder Nachricht melden.</p>
    <p>Sortiert wird nur nach Uhrzeit, nicht nach Klicks. Die App verwendet keine Werbung, kein Tracking und keine Anmeldung.</p>
    ${DATEN.stand ? `<p>Letzte Aktualisierung: ${esc(fmtZeit(DATEN.stand))} Uhr.</p>` : ""}
    <p><label class="stimmwahl">Stimme für die Videos: <select id="stimmWahl"><option value="">automatisch</option></select></label></p>

    <p><button class="btn hell" id="introBtn">Einführung noch einmal ansehen</button>

  </details>`;
  $app.innerHTML = html;
  const sw = document.getElementById("stimmWahl");
  if (sw && "speechSynthesis" in window){
    const fuellen = () => {
      let aktuell = ""; try { aktuell = localStorage.getItem("heft-stimme") || ""; } catch {}
      sw.innerHTML = `<option value="">automatisch</option>` + deutscheStimmen().map(v => `<option value="${esc(v.name)}"${v.name === aktuell ? " selected" : ""}>${esc(v.name)}</option>`).join("");
    };
    fuellen(); speechSynthesis.onvoiceschanged = fuellen;
    sw.onchange = () => {
      try { sw.value ? localStorage.setItem("heft-stimme", sw.value) : localStorage.removeItem("heft-stimme"); } catch {}
      try { const probe = new SpeechSynthesisUtterance("So klingt diese Stimme im Nachrichten-Heft."); const v = stimmeWaehlen(); if (v) probe.voice = v; probe.lang = "de-DE"; probe.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(probe); } catch {}
    };
  }
  const intro = document.getElementById("introBtn");
  if (intro) intro.onclick = () => introZeigen(true);
  const eb = document.getElementById("eilBtn");
  if (eb) eb.onclick = () => { merker.weg("heft-eil"); location.hash = "#/eil"; };

}

const merkliste = {
  lesen(){ try { return JSON.parse(localStorage.getItem("heft-merk") || "[]"); } catch { return []; } },
  hat(id){ return merkliste.lesen().includes(id); },
  um(id){
    const l = merkliste.lesen();
    const neu = l.includes(id) ? l.filter(x => x !== id) : [id, ...l].slice(0, 100);
    try { localStorage.setItem("heft-merk", JSON.stringify(neu)); } catch {}
    return neu.includes(id);
  }
};

/* ---------- Handy-Mitteilungen (Web Push) ---------- */
const pushMoeglich = () => "serviceWorker" in navigator && "PushManager" in window && DATEN.push?.url && DATEN.push?.key;
function b64ZuBytes(b64){
  const rein = (b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(rein), c => c.charCodeAt(0));
}
async function pushStatus(){
  if (!pushMoeglich()) return "nicht möglich";
  if (Notification.permission === "denied") return "blockiert";
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) ? "an" : "aus";
}
async function pushAnmelden(rubriken){
  const erlaubnis = await Notification.requestPermission();
  if (erlaubnis !== "granted") return "blockiert";
  const reg = await navigator.serviceWorker.ready;
  const abo = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ZuBytes(DATEN.push.key) });
  const r = await fetch(DATEN.push.url + "/abo", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ abo: abo.toJSON(), rubriken }) });
  if (!r.ok) throw new Error("Anmeldung fehlgeschlagen");
  try { localStorage.setItem("heft-push-rubriken", JSON.stringify(rubriken)); } catch {}
  return "an";
}
async function pushAbmelden(){
  const reg = await navigator.serviceWorker.ready;
  const abo = await reg.pushManager.getSubscription();
  if (!abo) return "aus";
  try { await fetch(DATEN.push.url + "/abmelden", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ endpoint: abo.endpoint }) }); } catch {}
  await abo.unsubscribe();
  return "aus";
}

/* ---------- Suche & Archiv ---------- */
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "").replace(/ß/g, "ss");
function suchen(q, suche){
  const worte = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!worte.length) return [];
  const passt = text => { const t = norm(text); return worte.every(w => t.includes(w)); };
  const aktiv = NACHRICHTEN.filter(n => passt([n.titel, n.vorspann, n.rubrik, ...(n.zusammenfassung||[])].join(" ")));
  const ids = new Set(aktiv.map(n => n.id));
  const alt = suche.filter(e => !ids.has(e.id) && passt([e.titel, e.vorspann, e.rubrik].join(" ")));
  return [...aktiv, ...alt].sort((a,b) => b.zeit.localeCompare(a.zeit)).slice(0, 60);
}
async function archivSeite(monat, q){
  document.getElementById("rubNav").hidden = true;
  $app.innerHTML = `${zurueck}<h1 class="seiten-titel">Suche &amp; Archiv</h1>

    <div id="ergebnis"><p class="treffer-info">Archiv wird geladen …</p></div>`;
  const suche = await ladeSuche();
  const erg = document.getElementById("ergebnis"), feld = document.getElementById("q");
  const zeige = () => {
    const text = feld.value.trim();
    history.replaceState(null, "", text ? `#/archiv?q=${encodeURIComponent(text)}` : (monat ? `#/archiv/${monat}` : "#/archiv"));
    if (text){
      const t = suchen(text, suche);
      erg.innerHTML = `<p class="treffer-info">${t.length} Treffer für „${esc(text)}“</p>` + (t.length ? `<div class="list">${t.map(n => karte(n, true)).join("")}</div>` : `<div class="empty">Nichts gefunden. Probiere ein anderes oder kürzeres Stichwort.</div>`);
      return;
    }
    const monate = {};
    suche.forEach(e => monate[e.monat] = (monate[e.monat] || 0) + 1);
    const liste = Object.keys(monate).sort().reverse();
    let html = `<div class="monate"><a class="monat" href="#/">Aktuell (${NACHRICHTEN.length})</a>${liste.map(m => `<a class="monat" href="#/archiv/${m}"${m===monat?' style="outline:2px solid var(--bar-2)"':""}>${esc(monatName(m))} (${monate[m]})</a>`).join("")}</div>`;
    if (monat){
      const eintraege = suche.filter(e => e.monat === monat);
      html += `<p class="treffer-info">${esc(monatName(monat))}: ${eintraege.length} Nachrichten</p><div class="list">${eintraege.map(n => karte(n, true)).join("")}</div>`;
    } else if (!liste.length){
      html += `<div class="empty">Das Archiv ist noch leer. Nachrichten kommen hierher, sobald sie älter als zwei Tage sind.</div>`;
    } else html += `<p class="treffer-info">Wähle einen Monat oder suche nach einem Stichwort. Das Archiv reicht 13 Monate zurück.</p>`;
    erg.innerHTML = html;
  };
  let timer; feld.oninput = () => { clearTimeout(timer); timer = setTimeout(zeige, 200); };
  zeige();
  if (!q && !monat && matchMedia("(pointer:fine)").matches) feld.focus();
}

function neutralCheck(n){
  const arten = [...new Set(n.medien.map(m => m.art))];
  const stamm = n.medien.filter(m => m.stamm).length;
  const minBelege = n.einig.length ? Math.min(...n.einig.map(e => e[1].length)) : 0;
  const punkte = [
    [minBelege >= 2, `Jeder Punkt unter „einig“ ist von mindestens ${minBelege} Medien belegt.`],
    [arten.length >= 2, arten.length >= 2 ? `Verschiedene Arten von Quellen: ${arten.join(", ")}.` : `Nur eine Art von Quelle (${arten[0]}). Das kann den Blickwinkel einseitig machen.`],
    [stamm >= 2, `${stamm} von ${n.medien.length} Quellen stammen aus der Stammliste.`],
    [true, "Aussagen von Beteiligten sind als Aussage gekennzeichnet, nicht als Tatsache."],
    [!/nicht vor|nicht enthalten|nur in einem|nicht gefunden/.test(n.fehlend || ""), "Fehlende Stimmen: siehe „Wer nicht zu Wort kommt“."]
  ];
  if (typeof n.geprueft === "boolean"){
    punkte.push(n.geprueft
      ? [true, `Von einer zweiten KI-Prüfung mit den Originalberichten abgeglichen${n.korrekturen?.length ? ` (${n.korrekturen.length} Korrektur${n.korrekturen.length>1?"en":""})` : " (keine Korrekturen nötig)"}.`]
      : [false, "Die zweite Prüfung hat nicht funktioniert. Bitte besonders kritisch lesen."]);
    punkte.push(n.wortwarnung?.length
      ? [false, `Möglicherweise wertende Wörter: ${n.wortwarnung.join(", ")}.`]
      : [true, "Keine Wörter aus der Liste wertender Begriffe gefunden."]);
  }
  const protokoll = n.korrekturen?.length ? `<details><summary>Was die Prüfung geändert hat</summary><ul>${n.korrekturen.map(k => `<li>${esc(k)}</li>`).join("")}</ul></details>` : "";
  return `<aside class="check-box"><h2>Neutralitäts-Check</h2><ul>${
    punkte.map(([ok,t]) => `<li><span class="${ok?"ok":"warn"}">${ok?"✓":"!"}</span>${esc(t)}</li>`).join("")}</ul>${protokoll}</aside>`;
}

function lernbereich(l){
  if (!l) return "";
  return `<section class="block lernen"><h2>Lernen &amp; Diskutieren</h2>
    ${l.begriffe?.length ? `<h3>Begriffe erklärt</h3><dl>${l.begriffe.map(([b,e]) => `<dt>${esc(b)}</dt><dd>${esc(e)}</dd>`).join("")}</dl>` : ""}
    ${l.fragen?.length ? `<h3>Fragen zur Diskussion</h3><ol>${l.fragen.map(f => `<li>${esc(f)}</li>`).join("")}</ol>` : ""}
    ${l.quiz?.length ? `<h3>Quiz: Hast du es verstanden?</h3>${l.quiz.map((q,i) => `<div class="quiz" data-i="${i}">
      <div class="quiz-frage">${i+1}. ${esc(q.frage)}</div>
      ${q.optionen.map((o,j) => `<button data-j="${j}">${esc(o)}</button>`).join("")}
      <div class="erkl" hidden></div></div>`).join("")}` : ""}
  </section>`;
}
function quizAktivieren(l){
  document.querySelectorAll(".quiz").forEach(box => {
    const q = l.quiz[+box.dataset.i];
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      const j = +b.dataset.j;
      box.querySelectorAll("button").forEach(x => { x.disabled = true; if (+x.dataset.j === q.richtig) x.classList.add("richtig"); });
      if (j !== q.richtig) b.classList.add("falsch");
      const e = box.querySelector(".erkl");
      e.innerHTML = `<b>${j === q.richtig ? "Richtig!" : "Nicht ganz."}</b> ${esc(q.erklaerung)}`;
      e.hidden = false;
    });
  });
}

function fehlerMelden(n){
  const topic = DATEN.fehlerTopic || (DATEN.ntfyTopic ? DATEN.ntfyTopic + "-fehler" : "");
  if (!topic) return "";
  return `<div class="melden"><button class="btn hell" id="meldenBtn">⚑ Fehler melden</button>
    <form id="meldenForm" hidden>
      <label class="status" for="art">Was stimmt nicht?</label>
      <select id="art"><option>Falscher Fakt oder falsche Zahl</option><option>Wertende oder einseitige Formulierung</option><option>Quelle falsch zugeordnet</option><option>Link funktioniert nicht</option><option>Sonstiges</option></select>
      <label class="status" for="txt">Beschreibung (bitte keine Namen oder persönlichen Daten)</label>
      <textarea id="txt" maxlength="800" placeholder="Was genau ist falsch? Wo steht es richtig?"></textarea>
      <button class="btn" type="submit">Meldung senden</button>
      <div class="status" id="meldenStatus" role="status"></div>
    </form></div>`;
}
function meldenAktivieren(n){
  const btn = document.getElementById("meldenBtn"); if (!btn) return;
  const form = document.getElementById("meldenForm");
  btn.onclick = () => { form.hidden = !form.hidden; };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const st = document.getElementById("meldenStatus"), txt = document.getElementById("txt").value.trim();
    if (txt.length < 5){ st.textContent = "Bitte kurz beschreiben, was falsch ist."; return; }
    st.textContent = "Wird gesendet …";
    try{
      const r = await fetch("https://ntfy.sh/", { method:"POST", body: JSON.stringify({
        topic: DATEN.fehlerTopic || DATEN.ntfyTopic + "-fehler",
        title: "Fehlermeldung: " + n.titel.slice(0, 80),
        message: `${document.getElementById("art").value}\n\n${txt}\n\nNachricht-ID: ${n.id}`,
        tags: ["warning"], click: location.href }) });
      if (!r.ok) throw 0;
      form.innerHTML = `<p class="status">✓ Danke! Die Meldung wurde an die Redaktion geschickt.</p>`;
    }catch{ st.textContent = "Senden hat nicht geklappt. Bitte später erneut versuchen."; }
  };
}

async function detailSuchen(id){
  const n = NACHRICHTEN.find(x => x.id === id);
  if (n) return detail(n);
  $app.innerHTML = `<p class="laden">Nachricht wird aus dem Archiv geladen …</p>`;
  const e = (await ladeSuche()).find(x => x.id === id);
  const a = e && (await ladeMonat(e.monat)).find(x => x.id === id);
  if (a) return detail(a, true);
  $app.innerHTML = `${zurueck}<div class="empty" style="margin-top:16px"><strong>Diese Nachricht wurde nicht gefunden.</strong><br>Vielleicht ist sie älter als 13 Monate oder du bist offline.</div>`;
}

function deutschlandLaden(){
  if (DEUTSCHLAND) return DEUTSCHLAND;
  DEUTSCHLAND = DE_ROH.split(";").map(land => land.split("|").map(ring => ring.split(" ").map(q => q.split(",").map(Number))));

function wetterKarteSVG(w, tag = "heute"){
  const orte = w?.orte || []; if (!orte.length) return "";
  const W = 800, H = 450, x0 = 1.09, y1 = 55.69, breite = 18.72, hoehe = 10.53;
  const px = ([lon, lat]) => [(lon - x0) / breite * W, (y1 - lat) / hoehe * H];
  const pfad = ring => `M${ring.map(px).map(q => q.map(v => v.toFixed(1)).join(",")).join("L")}Z`;
  let nachbarn = "";
  if (typeof weltLaden === "function"){
    for (const land of weltLaden()) for (const ring of land){
      let drin = false;
      for (const [lon, lat] of ring) if (lon > x0 - 6 && lon < x0 + breite + 6 && lat < y1 + 6 && lat > y1 - hoehe - 6){ drin = true; break; }
      if (drin) nachbarn += `<path d="${pfad(ring)}"/>`;
    }
  }
  // Jedes Bundesland bekommt die Farbe der Temperatur – zwischen den Messpunkten gewichtet gemittelt
  const wert = (lon, lat) => {
    let oben = 0, unten = 0;
    for (const o of orte){
      const t = (o[tag] || o.heute).max;
      const d = Math.max(0.15, Math.hypot(o.lon - lon, o.lat - lat));
      const g = 1 / (d * d);
      oben += t * g; unten += g;
    }
    return unten ? oben / unten : 15;
  };
  let laender = "";
  for (const land of deutschlandLaden()) for (const ring of land){
    let sx = 0, sy = 0;
    for (const q of ring){ sx += q[0]; sy += q[1]; }
    const farbe = tempFarbe(wert(sx / ring.length, sy / ring.length));
    laender += `<path d="${pfad(ring)}" fill="${farbe}"/>`;
  }
  const marken = orte.map(o => {
    const [x, y] = px([o.lon, o.lat]); const t = o[tag] || o.heute;
    const links = x > W * 0.62;
    return `<g class="w-ort" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <g class="w-sym" transform="translate(0 -21)">${wetterSymbol(t.code)}</g>
      <circle r="3.4"/>
      <text class="w-grad" x="${links ? -10 : 10}" y="5" text-anchor="${links ? "end" : "start"}">${t.max}°</text>
      <text class="w-stadt" x="${links ? -10 : 10}" y="19" text-anchor="${links ? "end" : "start"}">${esc(o.name)}</text></g>`;
  }).join("");
  const skala = [0, 8, 14, 20, 26, 32];
  const legende = `<g class="w-legende" transform="translate(${W - 30} ${H - 222})">
    ${skala.map((t, i) => `<rect x="0" y="${(skala.length - 1 - i) * 22}" width="15" height="22" fill="${tempFarbe(t)}"/>
      <text x="-5" y="${(skala.length - 1 - i) * 22 + 15}" text-anchor="end">${t}°</text>`).join("")}</g>`;
  return `<svg class="karte wetterkarte" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wetterkarte für Deutschland">
    <defs><filter id="wschatten" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04101f" flood-opacity=".55"/></filter></defs>
    <rect width="${W}" height="${H}" class="k-meer"/>
    <g class="w-nachbarn">${nachbarn}</g>
    <g class="w-laender" filter="url(#wschatten)">${laender}</g>
    ${legende}${marken}</svg>`;
}
function wetterLeiste(){
  const w = DATEN.wetter;
  if (!w?.orte?.length) return "";
  const spanne = t => { const m = w.orte.map(o => (o[t] || o.heute).max); return `${Math.min(...m)} bis ${Math.max(...m)} Grad`; };
  return `<section class="videos wetterteil"><h2 class="abschnitt">Das Wetter <small>· ${esc(w.quelle)} · Karte: GeoBasis-DE / BKG (dl-de/by-2-0)</small></h2>
    <div class="wk-box">${wetterKarteSVG(w, "heute")}
      <div class="wk-band"><b>Heute ${esc(spanne("heute"))}</b><span>Morgen (${esc(w.morgenTag)}) ${esc(spanne("morgen"))}</span></div></div>
    ${modellVergleichHTML(w)}
    <div class="vreihe"><a class="vkarte sendung" href="#/video/wetter">
      <span class="vk-text"><b>▶ Das Wetter als Video</b><small>Karte für heute und morgen</small></span></a></div></section>`;
}
// Dieselbe Ehrlichkeit wie bei den Medien: Wettermodelle sind sich oft uneinig.
// Andere Apps zeigen eine Zahl und tun so, als waere sie sicher.
function modellVergleichHTML(w){
  const m = w && w.modelle;
  if (!m || !(m.orte || []).length) return "";
  const beispiel = [...m.orte].sort((a, b) => {
    const s = x => Math.max(...x.je.map(y => y.grad)) - Math.min(...x.je.map(y => y.grad));
    return s(b) - s(a);
  })[0];
  const einig = (m.spanneGrad || 0) <= 1 && !m.uneinigRegen;
  return `<div class="modellvgl${einig ? " einig" : ""}">
    <div class="mv-kopf">${einig ? "Die Wettermodelle sind sich einig" : "Hier sind sich die Wettermodelle uneinig"}
      <small>für morgen in ${esc(beispiel.name)}</small></div>
    <div class="mv-reihe">${beispiel.je.map(x => `<div class="mv-modell">
      <b>${esc(x.grad)}°</b><span>${esc(x.name)}</span>
      ${x.regen != null ? `<i>${x.regen >= 1 ? "Regen" : "trocken"}</i>` : ""}</div>`).join("")}</div>
    ${m.uneinigRegen ? `<p class="mv-text">In ${esc(m.uneinigRegen.ort)} erwartet ${esc(m.uneinigRegen.nass.join(" und "))}
      Regen, ${esc(m.uneinigRegen.trocken.join(" und "))} dagegen nicht.</p>` : ""}
    <p class="mv-quelle">Verglichen: ${esc((m.dienste || []).join(" · "))}</p></div>`;
}
