name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachrichten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: web-push installieren (für Handy-Mitteilungen)
        run: npm install web-push --no-save --silent

      - name: Nachrichten sammeln und zusammenfassen
        run: node update.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASIS: ${{ vars.OPENAI_BASIS }}
          OPENAI_MODELL: ${{ vars.OPENAI_MODELL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUSH_URL: ${{ vars.PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          VAPID_PUBLIC: ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      # Zuerst die Nachrichten sichern. Alles Weitere darf danach schiefgehen,
      # ohne dass die App auf einem alten Stand hängen bleibt.
      - name: Nachrichten speichern
        if: always()
        env:
          NACHRICHT: "Nachrichten-Update"
        run: |
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "$NACHRICHT $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4 5; do
            if git push; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            echo "Push abgelehnt - erst die neueren Dateien holen, dann noch einmal ($versuch)."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "Speichern hat nach fuenf Versuchen nicht geklappt."
          exit 1

      # ---- Sprecherstimme (Piper). Schlägt das fehl, laufen die Nachrichten trotzdem weiter. ----
      - name: Stimme zwischenspeichern
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .stimmen
          key: piper-stimme-de-thorsten-medium-v1

      - name: Bisherige Tonaufnahmen holen
        continue-on-error: true
        run: |
          mkdir -p ton
          if git fetch --depth=1 origin ton; then
            git archive FETCH_HEAD | tar -x -C ton
            echo "Vorhandene Aufnahmen: $(ls ton | wc -l)"
          else
            echo "Noch keine Tonaufnahmen vorhanden."
          fi

      - name: Sprecherstimme erzeugen
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet piper-tts
          python3 ton.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Ton veröffentlichen
        continue-on-error: true
        run: |
          if [ -z "$(ls -A ton 2>/dev/null)" ]; then
            echo "Kein Ton zum Veröffentlichen."
            exit 0
          fi
          rm -rf /tmp/tonzweig
          mkdir -p /tmp/tonzweig
          cp ton/*.mp3 /tmp/tonzweig/
          cd /tmp/tonzweig
          git init -q -b ton
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Tonaufnahmen $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ton:ton
          echo "Veröffentlicht: $(ls | wc -l) Aufnahmen"

      - name: Tonliste nachtragen
        if: always()
        continue-on-error: true
        env:
          NACHRICHT: "Tonaufnahmen"
        run: |
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "$NACHRICHT $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          for versuch in 1 2 3 4 5; do
            if git push; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            echo "Push abgelehnt - erst die neueren Dateien holen, dann noch einmal ($versuch)."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "Speichern hat nach fuenf Versuchen nicht geklappt."
          exit 1

      - name: Bei einem Fehler Bescheid geben
        if: failure() && vars.NTFY_TOPIC != ''
        continue-on-error: true
        run: |
          curl -s -X POST "https://ntfy.sh/${{ vars.NTFY_TOPIC }}-fehler" \
            -H "Title: Nachrichten-Heft: Lauf fehlgeschlagen" \
            -d "Der Lauf um $(TZ=Europe/Berlin date '+%H:%M') ist abgebrochen. Schau bei GitHub unter Actions nach." || true
