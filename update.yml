name: Nachrichten aktualisieren

on:
  # Zeiten in UTC. Die Liste deckt Sommer- und Winterzeit ab.
  # Das Programm prüft selbst, ob es in Berlin zwischen 6 und 21 Uhr ist
  # und ob seit dem letzten Lauf mindestens 2,5 Stunden vergangen sind.
  schedule:
    - cron: "7 4,5,7,8,10,11,13,14,16,17,19,20 * * *"
  workflow_dispatch:   # Knopf "Run workflow" = sofort aktualisieren

permissions:
  contents: write

concurrency:
  group: nachrichten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nachrichten sammeln und zusammenfassen
        run: node scripts/update.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Neue Ausgabe speichern
        run: |
          git config user.name "nachrichten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Nachrichten-Update $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git push
          fi
